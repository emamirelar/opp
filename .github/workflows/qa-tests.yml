            Write-Host "Found: $($_.FullName)"
          }
          $trxCount = (Get-ChildItem -Path $testResultsDir -Filter "*.trx" -Recurse -ErrorAction SilentlyContinue).Count
          echo "Total .trx files found: $trxCount"
        } else {
          echo "ERROR: TestResults directory does not exist at $testResultsDir"
        }
    
    - name: Publish Test Results
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: Presentation Tests Results
        path: '**/TestResults/**/*.trx'
        reporter: dotnet-trx
        fail-on-error: false

    - name: Upload Test Results Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: presentation-tests-results
        path: |
          TestResults
          **/coverage.cobertura.xml
        if-no-files-found: warn
    
    - name: Check Presentation Tests Result
      if: steps.run-presentation-tests.outcome != 'success'
      run: |
        echo "::error::Presentation Tests failed or encountered errors"
        exit 1

  frontend-tests:
    name: Frontend Build, Lint & Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        token: ${{ secrets.GH_PAT }}
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: UNOPS.PAO.ClientApp/package-lock.json
    
    - name: Install dependencies
      working-directory: UNOPS.PAO.ClientApp
      run: npm ci

    - name: Angular Build Verification
      working-directory: UNOPS.PAO.ClientApp
      run: npm run build

    - name: ESLint Check
      id: eslint-check
      continue-on-error: true
      working-directory: UNOPS.PAO.ClientApp
      run: npx eslint . --format stylish 2>&1 | head -200

    - name: npm Security Audit
      id: npm-audit
      continue-on-error: true
      working-directory: UNOPS.PAO.ClientApp
      run: npm audit --audit-level=high
    
    - name: Run Frontend Tests (CI mode)
      id: run-frontend-tests
      continue-on-error: true
      working-directory: UNOPS.PAO.ClientApp
      run: npm run test:ci
    
    - name: Upload Coverage Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: frontend-coverage
        path: UNOPS.PAO.ClientApp/coverage
        if-no-files-found: warn
    
    - name: Check Frontend Tests Result
      if: steps.run-frontend-tests.outcome != 'success'
      run: |
        echo "::error::Frontend Tests failed or encountered errors"
        exit 1

