  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [fast-tests, business-tests, presentation-tests, frontend-tests]
    if: always()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        token: ${{ secrets.GH_PAT }}

    - name: Generate Summary
      run: |
        echo "# QA Tests Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Automated Test Results (PR Checks)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Backend Tests" >> $GITHUB_STEP_SUMMARY
        echo "- Fast Logic Tests (~43 tests): ${{ needs.fast-tests.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Business Logic Tests (~3,800 tests, PostgreSQL): ${{ needs.business-tests.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Presentation/Controller Tests (~164 tests): ${{ needs.presentation-tests.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Frontend Checks" >> $GITHUB_STEP_SUMMARY
        echo "- Angular Build Verification: ${{ needs.frontend-tests.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- ESLint Static Analysis: ${{ needs.frontend-tests.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Angular Unit Tests (CI mode): ${{ needs.frontend-tests.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Security & Quality" >> $GITHUB_STEP_SUMMARY
        echo "- npm audit (high/critical): ${{ needs.frontend-tests.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- .NET vulnerable packages scan: ${{ needs.business-tests.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Code coverage (Coverlet + lcov): uploaded as artifacts" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Overall Status" >> $GITHUB_STEP_SUMMARY
        FAST="${{ needs.fast-tests.result }}"
        BIZ="${{ needs.business-tests.result }}"
        PRES="${{ needs.presentation-tests.result }}"
        FE="${{ needs.frontend-tests.result }}"
        if [[ "$FAST" == "success" ]] && [[ "$BIZ" == "success" ]] && [[ "$PRES" == "success" ]] && [[ "$FE" == "success" ]]; then
          echo "All PR checks passing" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo "- Workflow & ERP Logic (FastTests)" >> $GITHUB_STEP_SUMMARY
          echo "- Business Managers (~23 managers covered)" >> $GITHUB_STEP_SUMMARY
          echo "- Controller/API Layer (Dashboard, Comment, DocumentType, GmailAddon, SavedFilter)" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend Components (Angular CI spec subset)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note**: Integration tests must be run manually or in staging" >> $GITHUB_STEP_SUMMARY
          echo "- See: QA Tests/ENVIRONMENT_SETUP_GUIDE.md" >> $GITHUB_STEP_SUMMARY
          echo "- Run: dotnet test \"QA Tests/Integration Tests/UNOPS.PAO.IntegrationTests.csproj\"" >> $GITHUB_STEP_SUMMARY
        else
          echo "One or more test suites failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [[ "$FAST" != "success" ]]; then
            echo "- Fast Logic Tests: $FAST" >> $GITHUB_STEP_SUMMARY
          fi
          if [[ "$BIZ" != "success" ]]; then
            echo "- Business Logic Tests: $BIZ" >> $GITHUB_STEP_SUMMARY
          fi
          if [[ "$PRES" != "success" ]]; then
            echo "- Presentation Tests: $PRES" >> $GITHUB_STEP_SUMMARY
          fi
          if [[ "$FE" != "success" ]]; then
            echo "- Frontend Tests: $FE" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Troubleshooting" >> $GITHUB_STEP_SUMMARY
          echo "1. Review test logs above for specific failures" >> $GITHUB_STEP_SUMMARY
          echo "2. Run backend tests locally: dotnet test --configuration Release" >> $GITHUB_STEP_SUMMARY
          echo "3. Run frontend tests locally: cd UNOPS.PAO.ClientApp && npm run test:ci" >> $GITHUB_STEP_SUMMARY
          echo "4. Check for environment-specific issues (paths, configuration)" >> $GITHUB_STEP_SUMMARY
        fi
    
    - name: Check Critical Tests
      if: needs.fast-tests.result != 'success' || needs.business-tests.result != 'success' || needs.presentation-tests.result != 'success' || needs.frontend-tests.result != 'success'
      run: |
        echo "One or more test suites failed!"
        exit 1
