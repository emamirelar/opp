  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [fast-tests, business-tests]
    if: always()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive  # Required for UNOPS.Workflow - Business/Workflow adapters depend on it
        token: ${{ secrets.GH_PAT }}

    - name: Generate Summary
      run: |
        echo "# QA Tests Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Automated Test Results (PR Checks)" >> $GITHUB_STEP_SUMMARY
        echo "- Fast Logic Tests (78 tests): ${{ needs.fast-tests.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Business Logic Tests (2,135 tests): ${{ needs.business-tests.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Overall Status" >> $GITHUB_STEP_SUMMARY
        if [[ "${{ needs.fast-tests.result }}" == "success" ]] && [[ "${{ needs.business-tests.result }}" == "success" ]]; then
          echo "Γ£à All critical tests passing (2,213 tests)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo "- Γ£à Permission Logic (6 tests)" >> $GITHUB_STEP_SUMMARY
          echo "- Γ£à Workflow Logic (7 tests)" >> $GITHUB_STEP_SUMMARY
          echo "- Γ£à Notification Logic (7 tests)" >> $GITHUB_STEP_SUMMARY
          echo "- Γ£à Export Logic (6 tests)" >> $GITHUB_STEP_SUMMARY
          echo "- Γ£à Document Validation (11 tests)" >> $GITHUB_STEP_SUMMARY
          echo "- Γ£à Partner Manager (1,127 tests)" >> $GITHUB_STEP_SUMMARY
          echo "- Γ£à Other Business Logic (1,049 tests)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Γä╣∩╕Å **Note**: Integration tests must be run manually or in staging" >> $GITHUB_STEP_SUMMARY
          echo "- See: QA Tests/ENVIRONMENT_SETUP_GUIDE.md" >> $GITHUB_STEP_SUMMARY
          echo "- Run: dotnet test \"QA Tests/Integration Tests/UNOPS.PAO.IntegrationTests.csproj\"" >> $GITHUB_STEP_SUMMARY
        else
          echo "Γ¥î Critical tests failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ needs.fast-tests.result }}" != "success" ]]; then
            echo "- Γ¥î Fast Logic Tests: ${{ needs.fast-tests.result }}" >> $GITHUB_STEP_SUMMARY
            echo "  - Check the FastTests Results for detailed failure information" >> $GITHUB_STEP_SUMMARY
          fi
          if [[ "${{ needs.business-tests.result }}" != "success" ]]; then
            echo "- Γ¥î Business Logic Tests: ${{ needs.business-tests.result }}" >> $GITHUB_STEP_SUMMARY
            echo "  - Check the Business Tests Results for detailed failure information" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Troubleshooting" >> $GITHUB_STEP_SUMMARY
          echo "1. Review test logs above for specific failures" >> $GITHUB_STEP_SUMMARY
          echo "2. Run tests locally: dotnet test --configuration Release" >> $GITHUB_STEP_SUMMARY
          echo "3. Check for environment-specific issues (paths, configuration)" >> $GITHUB_STEP_SUMMARY
        fi
    
    - name: Check Critical Tests
      if: needs.fast-tests.result != 'success' || needs.business-tests.result != 'success'
      run: |
        echo "Critical tests failed!"
        exit 1
