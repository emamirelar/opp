name: QA Tests

on:
  push:
    branches: [ main, dev-deploy, QA-Tests ]
  pull_request:
    branches: [ main, dev-deploy ]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'

env:
  DOTNET_VERSION: '9.0.x'
  NODE_VERSION: '20'

jobs:
  fast-tests:
    name: Fast Logic Tests
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive  # Required for UNOPS.Workflow - Business/Workflow adapters depend on it
        token: ${{ secrets.GH_PAT }}

    - name: Ensure Workflow submodule initialized
      run: git submodule update --init --recursive UNOPS.Workflow

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build
      run: dotnet build --no-restore --configuration Release
    
    - name: Run FastTests
      id: run-fast-tests
      continue-on-error: true
      run: |
        $testResultsDir = Join-Path "${{ github.workspace }}" "TestResults"
        New-Item -ItemType Directory -Force -Path $testResultsDir | Out-Null
        dotnet test "QA Tests/C# Tests/UNOPS.PAO.FastTests/UNOPS.PAO.FastTests.csproj" `
          --no-build `
          --configuration Release `
          --verbosity normal `
          --logger "trx;LogFileName=fast-tests.trx" `
          --results-directory $testResultsDir `
          --collect:"XPlat Code Coverage"
    
    - name: List Test Results (Debug)
      if: always()
      run: |
        $testResultsDir = Join-Path "${{ github.workspace }}" "TestResults"
        echo "Looking for test results in: $testResultsDir"
        if (Test-Path $testResultsDir) {
          Get-ChildItem -Path $testResultsDir -Recurse -Filter "*.trx" -ErrorAction SilentlyContinue | ForEach-Object { 
            Write-Host "Found: $($_.FullName)"
          }
          $trxCount = (Get-ChildItem -Path $testResultsDir -Filter "*.trx" -Recurse -ErrorAction SilentlyContinue).Count
          echo "Total .trx files found: $trxCount"
        } else {
          echo "ERROR: TestResults directory does not exist at $testResultsDir"
        }
    
    - name: Publish Test Results
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: FastTests Results
        path: '**/TestResults/**/*.trx'
        reporter: dotnet-trx
        fail-on-error: false

    - name: Upload Test Results Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: fast-tests-results
        path: |
          TestResults
          **/coverage.cobertura.xml
        if-no-files-found: warn
    
    - name: Check FastTests Result
      if: steps.run-fast-tests.outcome != 'success'
      run: |
        echo "::error::FastTests failed or encountered errors"
        exit 1

  business-tests:
    name: Business Logic Tests (PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: unops_pao_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        token: ${{ secrets.GH_PAT }}

    - name: Ensure Workflow submodule initialized
      run: git submodule update --init --recursive UNOPS.Workflow
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Install EF Core tools
      run: dotnet tool install --global dotnet-ef

    - name: Apply EF Migrations
      run: |
        dotnet ef database update \
          --project UNOPS.PAO.UNOPSDataAccess/UNOPS.PAO.UNOPSDataAccess.csproj \
          --startup-project UNOPS.PAO.Server/UNOPS.PAO.Server.csproj
      env:
        ConnectionStrings__DefaultConnection: 'Host=localhost;Port=5432;Database=unops_pao_test;Username=test_user;Password=test_password;Include Error Detail=true'
        ConnectionStrings__UseIamAuthentication: 'false'
        IsUNOPSOverride: 'true'
    
    - name: .NET Dependency Vulnerability Scan
      id: dotnet-vuln-scan
      continue-on-error: true
      run: dotnet list package --vulnerable --include-transitive 2>&1 | tail -60

    - name: Run Business Tests
      id: run-business-tests
      continue-on-error: true
      run: |
        mkdir -p "${{ github.workspace }}/TestResults"
        dotnet test "QA Tests/C# Tests/UNOPS.PAO.Business.Tests/UNOPS.PAO.Business.Tests.csproj" \
          --no-build \
          --configuration Release \
          --verbosity normal \
          --logger "trx;LogFileName=business-tests.trx" \
          --results-directory "${{ github.workspace }}/TestResults" \
          --collect:"XPlat Code Coverage"
      env:
        TEST_DB_CONNECTION_STRING: 'Host=localhost;Port=5432;Database=unops_pao_test;Username=test_user;Password=test_password;Include Error Detail=true'
    
    - name: List Test Results (Debug)
      if: always()
      run: |
        echo "Looking for test results in: ${{ github.workspace }}/TestResults"
        find "${{ github.workspace }}/TestResults" -name "*.trx" 2>/dev/null || echo "No .trx files found"
    
    - name: Publish Test Results
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: Business Tests Results
        path: '**/TestResults/**/*.trx'
        reporter: dotnet-trx
        fail-on-error: false

    - name: Upload Test Results Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: business-tests-results
        path: |
          TestResults
          **/coverage.cobertura.xml
        if-no-files-found: warn
    
    - name: Check Business Tests Result
      if: steps.run-business-tests.outcome != 'success'
      run: |
        echo "::error::Business Tests failed or encountered errors"
        exit 1

  presentation-tests:
    name: Presentation (Controller) Tests
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
