name: QA Tests

on:
  push:
    branches: [ main, dev-deploy, QA-Tests ]
  pull_request:
    branches: [ main, dev-deploy ]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'

env:
  DOTNET_VERSION: '9.0.x'
  PYTHON_VERSION: '3.11'

jobs:
  fast-tests:
    name: Fast Logic Tests
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive  # Required for UNOPS.Workflow - Business/Workflow adapters depend on it
        token: ${{ secrets.GH_PAT }}

    - name: Ensure Workflow submodule initialized
      run: git submodule update --init --recursive UNOPS.Workflow

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build
      run: dotnet build --no-restore --configuration Release
    
    - name: Run FastTests
      id: run-fast-tests
      continue-on-error: true
      run: |
        $testResultsDir = Join-Path "${{ github.workspace }}" "TestResults"
        New-Item -ItemType Directory -Force -Path $testResultsDir | Out-Null
        dotnet test "QA Tests/C# Tests/UNOPS.PAO.FastTests/UNOPS.PAO.FastTests.csproj" `
          --no-build `
          --configuration Release `
          --verbosity normal `
          --logger "trx;LogFileName=fast-tests.trx" `
          --results-directory $testResultsDir
    
    - name: List Test Results (Debug)
      if: always()
      run: |
        $testResultsDir = Join-Path "${{ github.workspace }}" "TestResults"
        echo "Looking for test results in: $testResultsDir"
        if (Test-Path $testResultsDir) {
          Get-ChildItem -Path $testResultsDir -Recurse -Filter "*.trx" -ErrorAction SilentlyContinue | ForEach-Object { 
            Write-Host "Found: $($_.FullName)"
          }
          $trxCount = (Get-ChildItem -Path $testResultsDir -Filter "*.trx" -Recurse -ErrorAction SilentlyContinue).Count
          echo "Total .trx files found: $trxCount"
        } else {
          echo "ERROR: TestResults directory does not exist at $testResultsDir"
        }
    
    - name: Publish Test Results
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: FastTests Results
        path: '**/TestResults/**/*.trx'
        reporter: dotnet-trx
        fail-on-error: false

    - name: Upload Test Results Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: fast-tests-results
        path: TestResults
        if-no-files-found: warn
    
    - name: Check FastTests Result
      if: steps.run-fast-tests.outcome != 'success'
      run: |
        echo "::error::FastTests failed or encountered errors"
        exit 1

  business-tests:
    name: Business Logic Tests
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive  # Required for UNOPS.Workflow - Business/Workflow adapters depend on it
        token: ${{ secrets.GH_PAT }}

    - name: Ensure Workflow submodule initialized
      run: git submodule update --init --recursive UNOPS.Workflow
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build
      run: dotnet build --no-restore --configuration Release
    
    - name: Run Business Tests
      id: run-business-tests
      continue-on-error: true
      run: |
        $testResultsDir = Join-Path "${{ github.workspace }}" "TestResults"
        New-Item -ItemType Directory -Force -Path $testResultsDir | Out-Null
        dotnet test "QA Tests/C# Tests/UNOPS.PAO.Business.Tests/UNOPS.PAO.Business.Tests.csproj" `
          --no-build `
          --configuration Release `
          --verbosity normal `
          --logger "trx;LogFileName=business-tests.trx" `
          --results-directory $testResultsDir
    
    - name: List Test Results (Debug)
      if: always()
      run: |
        $testResultsDir = Join-Path "${{ github.workspace }}" "TestResults"
        echo "Looking for test results in: $testResultsDir"
        if (Test-Path $testResultsDir) {
          Get-ChildItem -Path $testResultsDir -Recurse -Filter "*.trx" -ErrorAction SilentlyContinue | ForEach-Object { 
            Write-Host "Found: $($_.FullName)"
          }
          $trxCount = (Get-ChildItem -Path $testResultsDir -Filter "*.trx" -Recurse -ErrorAction SilentlyContinue).Count
          echo "Total .trx files found: $trxCount"
        } else {
          echo "ERROR: TestResults directory does not exist at $testResultsDir"
        }
    
    - name: Publish Test Results
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: Business Tests Results
        path: '**/TestResults/**/*.trx'
        reporter: dotnet-trx
        fail-on-error: false

    - name: Upload Test Results Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: business-tests-results
        path: TestResults
        if-no-files-found: warn
    
    - name: Check Business Tests Result
      if: steps.run-business-tests.outcome != 'success'
      run: |
        echo "::error::Business Tests failed or encountered errors"
        exit 1

