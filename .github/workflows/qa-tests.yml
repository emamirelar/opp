name: QA Tests

on:
  push:
    branches: [ main, dev-deploy, QA-Tests ]
  pull_request:
    branches: [ main, dev-deploy ]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'

env:
  DOTNET_VERSION: '9.0.x'

jobs:
  # ===========================================================================
  # BUILD JOB - Build once, share artifacts with all test jobs
  # ===========================================================================
  build:
    name: Build Test Projects
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    outputs:
      business-tests-exist: ${{ steps.check-projects.outputs.business-exists }}
      fast-tests-exist: ${{ steps.check-projects.outputs.fast-exists }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for affected file detection
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
    
    - name: Check if test projects exist
      id: check-projects
      run: |
        if [ -f "QA Tests/C# Tests/UNOPS.PAO.Business.Tests/UNOPS.PAO.Business.Tests.csproj" ]; then
          echo "business-exists=true" >> $GITHUB_OUTPUT
          echo "✅ Business Tests project found"
        else
          echo "business-exists=false" >> $GITHUB_OUTPUT
          echo "ℹ️ Business Tests project not found"
        fi
        
        if [ -f "QA Tests/C# Tests/UNOPS.PAO.FastTests/UNOPS.PAO.FastTests.csproj" ]; then
          echo "fast-exists=true" >> $GITHUB_OUTPUT
          echo "✅ FastTests project found"
        else
          echo "fast-exists=false" >> $GITHUB_OUTPUT
          echo "ℹ️ FastTests project not found"
        fi
    
    - name: Restore Business Tests
      if: steps.check-projects.outputs.business-exists == 'true'
      run: dotnet restore "QA Tests/C# Tests/UNOPS.PAO.Business.Tests/UNOPS.PAO.Business.Tests.csproj"
    
    - name: Build Business Tests
      if: steps.check-projects.outputs.business-exists == 'true'
      run: dotnet build "QA Tests/C# Tests/UNOPS.PAO.Business.Tests/UNOPS.PAO.Business.Tests.csproj" --no-restore --configuration Release
    
    - name: Restore FastTests
      if: steps.check-projects.outputs.fast-exists == 'true'
      run: dotnet restore "QA Tests/C# Tests/UNOPS.PAO.FastTests/UNOPS.PAO.FastTests.csproj"
    
    - name: Build FastTests
      if: steps.check-projects.outputs.fast-exists == 'true'
      run: dotnet build "QA Tests/C# Tests/UNOPS.PAO.FastTests/UNOPS.PAO.FastTests.csproj" --no-restore --configuration Release
    
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: test-build-artifacts
        path: |
          QA Tests/C# Tests/UNOPS.PAO.Business.Tests/bin/Release/
          QA Tests/C# Tests/UNOPS.PAO.FastTests/bin/Release/
          QA Tests/C# Tests/UNOPS.PAO.Business.Tests/obj/
          QA Tests/C# Tests/UNOPS.PAO.FastTests/obj/
        retention-days: 1
        if-no-files-found: warn

  # ===========================================================================
  # FAST TESTS - Quick validation tests
  # ===========================================================================
  fast-tests:
    name: Fast Logic Tests
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.fast-tests-exist == 'true'
    timeout-minutes: 15
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
    
    - name: Download Build Artifacts
      uses: actions/download-artifact@v4
      with:
        name: test-build-artifacts
        path: QA Tests/C# Tests/
    
    - name: Run FastTests
      continue-on-error: true
      run: |
        testResultsDir="${{ github.workspace }}/TestResults"
        mkdir -p "$testResultsDir"
        dotnet test "QA Tests/C# Tests/UNOPS.PAO.FastTests/UNOPS.PAO.FastTests.csproj" \
          --no-build \
          --configuration Release \
          --verbosity normal \
          --logger "trx;LogFileName=fast-tests.trx" \
          --results-directory "$testResultsDir"
    
    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: fast-tests-results
        path: TestResults
        if-no-files-found: warn

  # ===========================================================================
  # BUSINESS TESTS - Split into 5 parallel jobs for maximum speed
  # ===========================================================================
  
  business-tests-managers:
    name: Business Tests (Managers)
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.business-tests-exist == 'true'
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
    
    - name: Download Build Artifacts
      uses: actions/download-artifact@v4
      with:
        name: test-build-artifacts
        path: QA Tests/C# Tests/
    
    - name: Run Manager Tests
      continue-on-error: true
      run: |
        testResultsDir="${{ github.workspace }}/TestResults"
        mkdir -p "$testResultsDir"
        dotnet test "QA Tests/C# Tests/UNOPS.PAO.Business.Tests/UNOPS.PAO.Business.Tests.csproj" \
          --no-build \
          --configuration Release \
          --verbosity normal \
          --filter "FullyQualifiedName~Manager" \
          --logger "trx;LogFileName=managers-tests.trx" \
          --results-directory "$testResultsDir"
    
    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: managers-tests-results
        path: TestResults
        if-no-files-found: warn

  business-tests-services:
    name: Business Tests (Services)
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.business-tests-exist == 'true'
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
    
    - name: Download Build Artifacts
      uses: actions/download-artifact@v4
      with:
        name: test-build-artifacts
        path: QA Tests/C# Tests/
    
    - name: Run Service Tests
      continue-on-error: true
      run: |
        testResultsDir="${{ github.workspace }}/TestResults"
        mkdir -p "$testResultsDir"
        dotnet test "QA Tests/C# Tests/UNOPS.PAO.Business.Tests/UNOPS.PAO.Business.Tests.csproj" \
          --no-build \
          --configuration Release \
          --verbosity normal \
          --filter "FullyQualifiedName~Service" \
          --logger "trx;LogFileName=services-tests.trx" \
          --results-directory "$testResultsDir"
    
    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: services-tests-results
        path: TestResults
        if-no-files-found: warn

  business-tests-opportunity:
    name: Business Tests (Opportunity)
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.business-tests-exist == 'true'
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
    
    - name: Download Build Artifacts
      uses: actions/download-artifact@v4
      with:
        name: test-build-artifacts
        path: QA Tests/C# Tests/
    
    - name: Run Opportunity Tests
      continue-on-error: true
      run: |
        testResultsDir="${{ github.workspace }}/TestResults"
        mkdir -p "$testResultsDir"
        dotnet test "QA Tests/C# Tests/UNOPS.PAO.Business.Tests/UNOPS.PAO.Business.Tests.csproj" \
          --no-build \
          --configuration Release \
          --verbosity normal \
          --filter "FullyQualifiedName~Opportunity" \
          --logger "trx;LogFileName=opportunity-tests.trx" \
          --results-directory "$testResultsDir"
    
    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: opportunity-tests-results
        path: TestResults
        if-no-files-found: warn

  business-tests-edge-cases:
    name: Business Tests (Edge Cases)
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.business-tests-exist == 'true'
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
    
    - name: Download Build Artifacts
      uses: actions/download-artifact@v4
      with:
        name: test-build-artifacts
        path: QA Tests/C# Tests/
    
    - name: Run Edge Case Tests
      continue-on-error: true
      run: |
        testResultsDir="${{ github.workspace }}/TestResults"
        mkdir -p "$testResultsDir"
        dotnet test "QA Tests/C# Tests/UNOPS.PAO.Business.Tests/UNOPS.PAO.Business.Tests.csproj" \
          --no-build \
          --configuration Release \
          --verbosity normal \
          --filter "FullyQualifiedName~EdgeCase|FullyQualifiedName~Concurrency|FullyQualifiedName~Performance" \
          --logger "trx;LogFileName=edge-cases-tests.trx" \
          --results-directory "$testResultsDir"
    
    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: edge-cases-tests-results
        path: TestResults
        if-no-files-found: warn

  business-tests-other:
    name: Business Tests (Other)
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.business-tests-exist == 'true'
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
    
    - name: Download Build Artifacts
      uses: actions/download-artifact@v4
      with:
        name: test-build-artifacts
        path: QA Tests/C# Tests/
    
    - name: Run Other Tests (Validation, Search, Integration, etc.)
      continue-on-error: true
      run: |
        testResultsDir="${{ github.workspace }}/TestResults"
        mkdir -p "$testResultsDir"
        # Run tests that don't match other categories
        dotnet test "QA Tests/C# Tests/UNOPS.PAO.Business.Tests/UNOPS.PAO.Business.Tests.csproj" \
          --no-build \
          --configuration Release \
          --verbosity normal \
          --filter "FullyQualifiedName!~Manager&FullyQualifiedName!~Service&FullyQualifiedName!~Opportunity&FullyQualifiedName!~EdgeCase&FullyQualifiedName!~Concurrency&FullyQualifiedName!~Performance" \
          --logger "trx;LogFileName=other-tests.trx" \
          --results-directory "$testResultsDir"
    
    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: other-tests-results
        path: TestResults
        if-no-files-found: warn

  # ===========================================================================
  # TEST SUMMARY - Aggregate results from all test jobs
  # ===========================================================================
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [build, fast-tests, business-tests-managers, business-tests-services, business-tests-opportunity, business-tests-edge-cases, business-tests-other]
    if: always()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download All Test Results
      uses: actions/download-artifact@v4
      with:
        path: all-test-results
        pattern: '*-tests-results'
        merge-multiple: true
    
    - name: Generate Summary
      run: |
        echo "# 🧪 QA Tests Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [[ "${{ needs.build.outputs.business-tests-exist }}" == "false" ]]; then
          echo "## ℹ️ Test Projects Not Yet Available" >> $GITHUB_STEP_SUMMARY
          echo "The QA test projects are not present on this branch yet." >> $GITHUB_STEP_SUMMARY
          exit 0
        fi
        
        echo "## Test Results by Category" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Test Suite | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|------------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Fast Logic Tests | ${{ needs.fast-tests.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Business Tests (Managers) | ${{ needs.business-tests-managers.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Business Tests (Services) | ${{ needs.business-tests-services.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Business Tests (Opportunity) | ${{ needs.business-tests-opportunity.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Business Tests (Edge Cases) | ${{ needs.business-tests-edge-cases.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Business Tests (Other) | ${{ needs.business-tests-other.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Check overall status
        FAST="${{ needs.fast-tests.result }}"
        MGR="${{ needs.business-tests-managers.result }}"
        SVC="${{ needs.business-tests-services.result }}"
        OPP="${{ needs.business-tests-opportunity.result }}"
        EDGE="${{ needs.business-tests-edge-cases.result }}"
        OTHER="${{ needs.business-tests-other.result }}"
        
        # Count successes (success or skipped is OK)
        SUCCESS_COUNT=0
        for result in "$FAST" "$MGR" "$SVC" "$OPP" "$EDGE" "$OTHER"; do
          if [[ "$result" == "success" || "$result" == "skipped" ]]; then
            ((SUCCESS_COUNT++))
          fi
        done
        
        echo "## Overall Status" >> $GITHUB_STEP_SUMMARY
        if [[ $SUCCESS_COUNT -ge 5 ]]; then
          echo "✅ **All critical tests passed!**" >> $GITHUB_STEP_SUMMARY
        else
          echo "⚠️ **Some tests had issues** ($SUCCESS_COUNT/6 passed)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Note: Cancelled jobs may indicate timeout. Run tests locally to verify:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "dotnet test \"QA Tests/C# Tests/UNOPS.PAO.Business.Tests\"" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        fi
    
    - name: Check Critical Tests
      # Only fail if fast-tests actually failed
      if: needs.build.outputs.fast-tests-exist == 'true' && needs.fast-tests.result == 'failure'
      run: |
        echo "Critical fast tests failed!"
        exit 1
