# =============================================================================
# PLAYWRIGHT E2E TESTS - Mocked API Tests (Fast)
# =============================================================================
# These tests use API mocks at the browser level, so they DON'T need:
# - Real database
# - Real .NET backend
# - EF migrations
#
# This makes them fast (~5-10 min) and suitable for every PR.
# =============================================================================

name: Playwright Tests

on:
  push:
    branches: [ main, dev, QA-Tests ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  # ===========================================================================
  # SMOKE TESTS - Run on every push/PR (fast feedback)
  # ===========================================================================
  smoke-tests:
    name: E2E Smoke Tests (Mocked)
    timeout-minutes: 20
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: UNOPS.PAO.ClientApp/package-lock.json
      
      - name: Install root dependencies (Playwright)
        run: npm ci
      
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      
      - name: Install Angular dependencies
        working-directory: ./UNOPS.PAO.ClientApp
        run: npm ci
      
      - name: Run Playwright Smoke Tests
        run: |
          npx playwright test \
            "QA Tests/Playwright Tests/contacts.spec.ts" \
            "QA Tests/Playwright Tests/partners.spec.ts" \
            "QA Tests/Playwright Tests/interactions.spec.ts" \
            "QA Tests/Playwright Tests/opportunities.spec.ts" \
            --project=chromium
        env:
          CI: true
      
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-smoke
          path: QA Tests/Playwright Tests/playwright-report/
          retention-days: 30
      
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-smoke
          path: QA Tests/Playwright Tests/test-results/
          retention-days: 30
      
      - name: Post Test Summary
        if: always()
        run: |
          echo "## Playwright Smoke Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Mocked E2E Tests** - No backend/database required" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -d "QA Tests/Playwright Tests/test-results" ]; then
            echo "Test results uploaded as artifact" >> $GITHUB_STEP_SUMMARY
          fi

  # ===========================================================================
  # FULL E2E TESTS - Run only on merge to main (comprehensive)
  # ===========================================================================
  full-e2e-tests:
    name: Full E2E Tests (With Backend)
    timeout-minutes: 90
    runs-on: ubuntu-latest
    # Only run on push to main (not PRs, not other branches)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: TestDb
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: UNOPS.PAO.ClientApp/package-lock.json
      
      - name: Restore .NET dependencies
        run: dotnet restore
      
      - name: Build .NET solution
        run: dotnet build --no-restore --configuration Release
      
      - name: Install root dependencies (Playwright)
        run: npm ci
      
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      
      - name: Install Angular dependencies
        working-directory: ./UNOPS.PAO.ClientApp
        run: npm ci
      
      - name: Install EF Core tools
        run: dotnet tool install --global dotnet-ef
      
      - name: Setup test database
        timeout-minutes: 45
        env:
          PGPASSWORD: test
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=TestDb;Username=test;Password=test;Include Error Detail=true"
        run: |
          echo "::group::Create PostgreSQL extensions"
          psql -h localhost -p 5432 -U test -d TestDb -c "CREATE EXTENSION IF NOT EXISTS vector;"
          psql -h localhost -p 5432 -U test -d TestDb -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"
          echo "::endgroup::"
          
          echo "::group::Run Identity migrations"
          dotnet ef database update --project UNOPS.PAO.DataAccess --startup-project UNOPS.PAO.Server --context PAOIdentityDbContext --connection "Host=localhost;Port=5432;Database=TestDb;Username=test;Password=test;Include Error Detail=true"
          echo "::endgroup::"
          
          echo "::group::Run Application migrations"
          echo "Starting at $(date)"
          dotnet ef database update --project UNOPS.PAO.UNOPSDataAccess --startup-project UNOPS.PAO.Server --context UNOPSAppDbContext --connection "Host=localhost;Port=5432;Database=TestDb;Username=test;Password=test;Include Error Detail=true"
          echo "Completed at $(date)"
          echo "::endgroup::"
          
          echo "::group::Setup test data"
          psql -h localhost -p 5432 -U test -d TestDb --no-psqlrc --quiet -f "setup-test-user.sql"
          psql -h localhost -p 5432 -U test -d TestDb --no-psqlrc --quiet -f "setup-opportunity-permissions.sql"
          echo "::endgroup::"
      
      - name: Start .NET backend
        run: |
          cd UNOPS.PAO.Server
          dotnet run --no-build --configuration Release --no-launch-profile &
          echo "Waiting for backend to start..."
          for i in {1..30}; do
            http_code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5159/health 2>/dev/null) || true
            if [ -n "$http_code" ] && [ "$http_code" != "000" ]; then
              echo "Backend is ready! (HTTP $http_code)"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done
        env:
          ASPNETCORE_ENVIRONMENT: Testing
          ASPNETCORE_URLS: http://localhost:5159
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=TestDb;Username=test;Password=test;Include Error Detail=true"
      
      - name: Run Full Playwright Tests
        run: |
          npx playwright test --project=chromium
        env:
          CI: true
          API_URL: http://localhost:5159
          ASPNETCORE_URLS: http://localhost:5159
      
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-full
          path: QA Tests/Playwright Tests/playwright-report/
          retention-days: 30
      
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-full
          path: QA Tests/Playwright Tests/test-results/
          retention-days: 30
      
      - name: Post Test Summary
        if: always()
        run: |
          echo "## Full E2E Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔄 **Full Integration Tests** - With real backend and database" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This runs on merge to main only." >> $GITHUB_STEP_SUMMARY
