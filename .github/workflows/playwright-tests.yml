name: Playwright Tests

on:
  push:
    branches: [ main, dev, QA-Tests ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  test:
    name: Run Playwright Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: TestDb
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: UNOPS.PAO.ClientApp/package-lock.json
      
      - name: Restore .NET dependencies
        run: dotnet restore
      
      - name: Build .NET solution
        run: dotnet build --no-restore --configuration Release
      
      - name: Install root dependencies (Playwright)
        run: npm ci
      
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      
      - name: Install Angular dependencies
        working-directory: ./UNOPS.PAO.ClientApp
        run: npm ci
      
      - name: Install EF Core tools
        run: dotnet tool install --global dotnet-ef
      
      - name: Setup test database
        timeout-minutes: 45
        env:
          PGPASSWORD: test
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=TestDb;Username=test;Password=test;Include Error Detail=true"
        run: |
          echo "::group::Create PostgreSQL extensions"
          psql -h localhost -p 5432 -U test -d TestDb -c "CREATE EXTENSION IF NOT EXISTS vector;"
          psql -h localhost -p 5432 -U test -d TestDb -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"
          echo "::endgroup::"
          
          echo "::group::Run Identity migrations (1 migration)"
          dotnet ef database update --project UNOPS.PAO.DataAccess --startup-project UNOPS.PAO.Server --context PAOIdentityDbContext --connection "Host=localhost;Port=5432;Database=TestDb;Username=test;Password=test;Include Error Detail=true"
          echo "::endgroup::"
          
          echo "::group::Run Application migrations (376 migrations - this takes ~20-30 minutes)"
          echo "Starting at $(date)"
          dotnet ef database update --project UNOPS.PAO.UNOPSDataAccess --startup-project UNOPS.PAO.Server --context UNOPSAppDbContext --connection "Host=localhost;Port=5432;Database=TestDb;Username=test;Password=test;Include Error Detail=true"
          echo "Completed at $(date)"
          echo "::endgroup::"
          
          echo "::group::Setup test data"
          psql -h localhost -p 5432 -U test -d TestDb --no-psqlrc --quiet -f "setup-test-user.sql"
          echo "Test user created"
          psql -h localhost -p 5432 -U test -d TestDb --no-psqlrc --quiet -f "setup-opportunity-permissions.sql"
          echo "Permissions configured"
          echo "::endgroup::"
      
      - name: Start .NET backend
        run: |
          cd UNOPS.PAO.Server
          dotnet run --no-build --configuration Release --no-launch-profile &
          echo "Waiting for backend to start..."
          for i in {1..30}; do
            if curl -f http://localhost:5159/health > /dev/null 2>&1; then
              echo "Backend is ready!"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done
        env:
          ASPNETCORE_ENVIRONMENT: Testing
          ASPNETCORE_URLS: http://localhost:5159
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=TestDb;Username=test;Password=test;Include Error Detail=true"
      
      - name: Run Playwright Tests
        run: |
          npx playwright test \
            "QA Tests/Playwright Tests/contacts.spec.ts" \
            "QA Tests/Playwright Tests/partners.spec.ts" \
            "QA Tests/Playwright Tests/interactions.spec.ts" \
            "QA Tests/Playwright Tests/opportunities.spec.ts" \
            --project=chromium \
            --workers=1
        env:
          CI: true
          API_URL: http://localhost:5159
      
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: QA Tests/Playwright Tests/playwright-report/
          retention-days: 30
      
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: QA Tests/Playwright Tests/test-results/
          retention-days: 30
      
      - name: Post Test Summary
        if: always()
        run: |
          echo "## Playwright Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "QA Tests/Playwright Tests/playwright-report/index.html" ]; then
            echo "✅ Tests completed. View the full report in the artifacts." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Tests may have failed to generate a report." >> $GITHUB_STEP_SUMMARY
          fi

