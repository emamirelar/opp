version: '3.8'

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=postgresql://postgres:0Y/X3YNxHLL0fL4T@db:5432/anusha
      - GOOGLE_GENAI_USE_VERTEXAI=TRUE
      - GOOGLE_CLOUD_PROJECT=unops-partneropportunity
      - GOOGLE_CLOUD_LOCATION=europe-west4
    depends_on:
      - db
    volumes:
      - ./.env:/app/.env  # Mount .env file for development
    restart: unless-stopped

  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=anusha
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=0Y/X3YNxHLL0fL4T
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data: 