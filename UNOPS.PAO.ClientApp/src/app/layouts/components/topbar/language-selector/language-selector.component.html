<p-menu #menu
	[model]="languageItems"
	[popup]="true"></p-menu>
<p-button
	(onClick)="menu.toggle($event)"
	type="button"
	[rounded]="true"
	[text]="true"
	aria-label="Language Selector"
	styleClass="!w-10 !h-10 !p-0 flex items-center justify-center">
	<ng-template pTemplate="content">
		<i class="pi pi-globe text-xl"></i>
	</ng-template>
</p-button>
