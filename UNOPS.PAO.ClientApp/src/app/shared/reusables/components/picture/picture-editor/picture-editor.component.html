<div class="flex flex-col gap-6">
  <!-- Loader overlay -->
  <div class="flex flex-col items-center justify-center gap-4 relative min-h-[400px]" [ngClass]="isProcessing || isUploading() ? 'opacity-50' : ''">
    @if (isProcessing || isUploading()) {
      <div class="absolute z-10 flex flex-col items-center">
        <p-progress-spinner/>
        @if (isUploading() && uploadProgress() > 0) {
          <div class="mt-2 text-sm">{{ 'label.pictureEditor.uploadProgress' | translate: {progress: uploadProgress()} }}</div>
        }
      </div>
    }

    <!-- Main editing area -->
    <div class="flex flex-col gap-4 w-full">
      <!-- Drop zone when no image is selected -->
      @if (!imageChangedEvent) {
        <div class="flex flex-col items-center justify-center w-full min-h-[400px] bg-gray-100 rounded-lg"
            (dragover)="$event.preventDefault()"
            (drop)="handleDrop($event)">
          <i class="pi pi-image text-6xl text-gray-600"></i>
          <p>{{ 'label.pictureEditor.dropImageHere' | translate }}</p>

          <!-- File upload area -->
          <p-fileUpload
            mode="basic"
            name="profile"
            [auto]="true"
            [customUpload]="true"
            [showUploadButton]="false"
            [showCancelButton]="false"
            accept="image/*"
            chooseIcon="pi pi-upload"
            [chooseLabel]="'button.chooseImage' | translate"
            (uploadHandler)="handleFileUpload($event)"
            styleClass="mt-4 p-button-secondary">
          </p-fileUpload>
        </div>
      }

      <!-- Image cropper when image is loaded -->
      @if (imageChangedEvent) {
        <div class="flex flex-col gap-4">
          <image-cropper
              [imageChangedEvent]="imageChangedEvent"
              [imageBase64]="imageBase64!"
              [maintainAspectRatio]="true"
              [aspectRatio]="1"
              [resizeToWidth]="200"
              [roundCropper]="true"
              format="png"
              (imageCropped)="imageCropped($event)"
              (imageLoaded)="imageLoaded()"
              (cropperReady)="cropperReady()"
              (loadImageFailed)="loadImageFailed()">
          </image-cropper>
        </div>
      }
    </div>
  </div>
      <div class="flex w-full gap-2 justify-end">
          <p-button [label]="'button.cancel' | translate" rounded icon="pi pi-times" (onClick)="hide()" styleClass="p-button-secondary" [text]="true"></p-button>
          <p-button [label]="'button.save' | translate" rounded icon="pi pi-check" (onClick)="applyChanges()" [disabled]="!croppedImage || isUploading()"></p-button>
      </div>
</div>
