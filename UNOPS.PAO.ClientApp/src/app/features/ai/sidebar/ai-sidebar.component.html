<div class="sidebar-container h-full flex flex-col" [class.sidebar-collapsed]="isSidebarCollapsed()">
  <!-- Header -->
  <div class="sidebar-header flex items-center justify-between p-4 border-b border-[var(--surface-border)]">
    <div class="flex items-center gap-3" [class.hidden]="isSidebarCollapsed()">
      <div class="w-8 h-8 rounded-full bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center">
        <img src="images/AI_visual_64.svg" alt="AI Assistant" class="w-4 h-4" />
      </div>
    </div>
    
    <button 
      class="p-2 rounded-lg hover:bg-[var(--surface-hover)] transition-colors"
      (click)="layoutService.onAiSidebarToggle()"
      [pTooltip]="isSidebarCollapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
      tooltipPosition="bottom">
      <i class="pi" [class]="isSidebarCollapsed() ? 'pi-angle-right' : 'pi-angle-left'"></i>
    </button>
  </div>

  <!-- Content -->
  <div class="sidebar-content flex-1 overflow-hidden" [class.hidden]="isSidebarCollapsed()">
    <!-- Search -->
    <div class="search-section p-4 border-b border-[var(--surface-border)]">
      <div class="relative">
        <i class="pi pi-search absolute left-3 top-1/2 transform -translate-y-1/2 text-[var(--text-color-secondary)]"></i>
        <input 
          type="text" 
          class="w-full pl-10 pr-4 py-2 border border-[var(--surface-border)] rounded-lg bg-[var(--surface-ground)] text-[var(--text-color)] placeholder-[var(--text-color-secondary)] focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Search sessions..."
          [(ngModel)]="searchQueryValue"
          (input)="onSearchChange($event)"
        />
      </div>
    </div>

    <!-- Sessions List -->
    <div class="sessions-list flex-1 overflow-y-auto">
      <div class="p-4 space-y-2">
        <div *ngIf="filteredSessions().length === 0" class="text-center text-[var(--text-color-secondary)] py-8">
          <p *ngIf="searchQuery(); else noSessions">No sessions found matching "{{ searchQuery() }}"</p>
          <ng-template #noSessions>
            <p>No sessions available</p>
          </ng-template>
        </div>
        
        <div *ngFor="let session of filteredSessions(); trackBy: trackBySessionId" 
             class="session-item p-3 rounded-lg border border-[var(--surface-border)] hover:bg-[var(--surface-hover)] cursor-pointer transition-colors"
             [class.session-active]="session.sessionId === selectedSessionId()"
             (click)="selectSession(session)">
          <div class="flex items-start justify-between">
            <div class="flex-1 min-w-0">
              <h4 class="text-sm font-medium text-[var(--text-color)] truncate">
                {{ session.title || 'Untitled Session' }}
              </h4>
              <p class="text-xs text-[var(--text-color-secondary)] mt-1">
                {{ getSessionDate(session) }}
              </p>
            </div>
            <div class="flex items-center gap-1 ml-2">
              <button 
                class="p-1 rounded hover:bg-[var(--surface-hover)] transition-colors"
                (click)="toggleSessionStar(session, $event)"
                [pTooltip]="session.isStarred ? 'Remove from favorites' : 'Add to favorites'"
                tooltipPosition="top">
                <i class="pi text-xs" [class]="getStarClasses(session)"></i>
              </button>
              <button 
                class="p-1 rounded hover:bg-[var(--surface-hover)] transition-colors"
                (click)="toggleSessionArchive(session, $event)"
                [pTooltip]="session.isArchived ? 'Unarchive' : 'Archive'"
                tooltipPosition="top">
                <i class="pi pi-archive text-xs text-[var(--text-color-secondary)]"></i>
              </button>
            </div>
          </div>
          <p *ngIf="session.lastMessage" class="text-xs text-[var(--text-color-secondary)] mt-2 line-clamp-2">
            {{ session.lastMessage }}
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
