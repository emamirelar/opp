<form class="main-container" #mainForm>
  <div class="field-container">
    <app-fundingOpportunityOverview
      [showHeader]="true"
      [fundingOpportunityId]="recordId"
    />
  </div>

  <div class="footer-container center-align">
    <p-button
      label="{{ 'label.proposal.initiateProposal' | translate }}"
      [styleClass]="'inititate-proposal-button'"
      (onClick)="handleOnInitiateProposalClick($event)"
    />
  </div>
</form>
