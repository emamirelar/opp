<div class="field-container" [formGroup]="formGroup">
  @if (this.showHeader()) {
    <div class="flex items-center p-4 flex-wrap">
      <div class="flex-none">
        <div class="header-container">
          <i class="pi pi-money-bill entity-icon"></i>
          <div>
            <h5 class="m-0">{{ recordData().name || "" }}</h5>
            <div class="sub-header">
              {{ "title.fundingOpportunity" | translate }}
            </div>
          </div>
        </div>
      </div>
    </div>
  }
  <p-panel header="{{ 'title.stage' | translate }}" styleClass="section">
    <p-steps
      [activeIndex]="currentStageIndex"
      [model]="stages()"
      [readonly]="true"
    />
  </p-panel>

  <p-panel
    header="{{ 'title.details' | translate }}"
    [toggleable]="true"
    [styleClass]="'section'"
  >
    <div class="mb-6">
      <label>{{ "label.name" | translate }}</label>
      <input pInputText fluid="true" formControlName="name" />
    </div>

    <div>
      <label>{{ "label.description" | translate }}</label>
      <textarea
        rows="5"
        cols="30"
        pTextarea
        fluid="true"
        formControlName="description"
      ></textarea>
    </div>
  </p-panel>

  <p-panel
    header="{{ 'title.why' | translate }}"
    [toggleable]="true"
    [styleClass]="'section'"
  >
    <div>
      <label>{{ "label.sdgs" | translate }}</label>
      <p-multiselect
        formControlName="sdGs"
        [options]="allSDGs()"
        optionLabel="description"
        fluid="true"
        [readonly]="true"
        [maxSelectedLabels]="100000"
      >
        <ng-template let-sdg #item>
          <div class="flex items-center gap-2">
            <img src="{{ sdg.logo }}" class="h-[36px] w-[36px]" />
            <span>{{ sdg.description }}</span>
          </div>
        </ng-template>
      </p-multiselect>
    </div>
  </p-panel>

  <p-panel
    header="{{ 'title.who' | translate }}"
    [toggleable]="true"
    [styleClass]="'section'"
  >
    <div class="mb-6">
      <label>{{ "label.eligibleEntities" | translate }}</label>
      <p-multiselect
        formControlName="eligibleEntities"
        [options]="allEligibleEntities()"
        optionLabel="name"
        fluid="true"
        [readonly]="true"
        [maxSelectedLabels]="100000"
      />
    </div>

    <div>
      <label>{{ "label.eligibilityCriteria" | translate }}</label>
      <input
        formControlName="eligibilityCriteria"
        pInputText
        fluid="true"
        [readonly]="true"
      />
    </div>
  </p-panel>

  <p-panel
    header="{{ 'title.what' | translate }}"
    [toggleable]="true"
    [styleClass]="'section'"
  >
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div>
        <label>{{ "title.currency" | translate }}</label>
        <p-select
          formControlName="currency"
          [options]="allCurrencies()"
          optionLabel="name"
          [readonly]="true"
          fluid="true"
        />
      </div>

      <div>
        <label>{{
          "label.fundingOpportunity.availableFunding" | translate
        }}</label>
        <p-inputnumber
          formControlName="fundingAvailable"
          mode="decimal"
          [minFractionDigits]="2"
          [maxFractionDigits]="2"
          [readonly]="true"
          fluid="true"
        />
      </div>

      <div>
        <label>{{
          "label.fundingOpportunity.applicationType" | translate
        }}</label>
        <p-select
          formControlName="applicationType"
          [options]="allApplicationTypes()"
          optionLabel="displayName"
          [readonly]="true"
          fluid="true"
        />
      </div>
    </div>
  </p-panel>

  <p-panel
    header="{{ 'title.when' | translate }}"
    [toggleable]="true"
    [styleClass]="'section'"
  >
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div>
        <label>{{ "label.postedDate" | translate }}</label>
        <p-datepicker
          formControlName="postingDate"
          [showTime]="true"
          [showIcon]="true"
          fluid="true"
        />
      </div>
      <div>
        <label>{{
          "label.fundingOpportunity.submissionDueDate" | translate
        }}</label>
        <p-datepicker
          formControlName="submissionDueDate"
          [showTime]="true"
          [showIcon]="true"
          fluid="true"
        />
      </div>
      <div>
        <label>{{ "label.clarificationDeadline" | translate }}</label>
        <p-datepicker
          formControlName="clarificationDeadline"
          [showTime]="true"
          [showIcon]="true"
          fluid="true"
        />
      </div>
      <div>
        <label>{{ "label.informationSession" | translate }}</label>
        <p-datepicker
          formControlName="informationSessionDate"
          [showTime]="true"
          [showIcon]="true"
          fluid="true"
        />
      </div>
    </div>
  </p-panel>
</div>
