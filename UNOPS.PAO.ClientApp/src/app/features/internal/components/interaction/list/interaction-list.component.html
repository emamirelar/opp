<div class="flex flex-col gap-8 w-full">
  <div class="flex items-center gap-4 flex-wrap">
    <div class="flex items-center gap-4 interaction-section-header">
      <span class="material-symbols-outlined text-3xl">chat</span>
      <p class="text-3xl font-bold">{{ 'title.interactions' | translate }}</p>
    </div>
    <div class="ml-auto flex gap-2">
      @if(!permissionsLoading() && permissionUtilityService.canCreate(entityPermissions())) {
        <p-button
          icon="pi pi-file-import"
          [label]="'button.import' | translate"
          (click)="openImportDialog()"
          text rounded
          class="interaction-import-button"
        />
        <p-button
          [label]="'title.newInteraction' | translate"
          icon="pi pi-plus"
          (click)="openNewInteractionModal()"
          rounded
          class="interaction-new-button"
        ></p-button>
      }
    </div>
  </div>

  <app-listview
    #listviewComponent
    [dataUrl]="'/api/interactions'"
    [columns]="columns()"
    [entityType]="'Interaction'"
    [config]="listviewConfig()"
    (rowClick)="openEditInteractionModal($event)"
    (searchChange)="onSearchChange($event)"
    class="interaction-listview"
  >
  </app-listview>
</div>
