<div class="flex flex-col h-full gap-4">
  <div class="flex flex-col gap-2 mb-4">
    <p class="text-gray-600">{{ 'label.partner.approvePartnerDescription' | translate }}</p>
    <div class="text-lg font-semibold text-blue-700">{{ partner.name }}</div>
  </div>

  @if( showValidationFailedError() === true ){
  <p-message severity="error" icon="pi pi-info-circle" styleClass="mt-2 mb-3">{{ 'validation.pleaseFullAllRequired' | translate }}</p-message>
  }

  <form [formGroup]="formGroup" class="flex flex-col gap-6">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      
      <!-- 1. Key Global Partner -->
      <div class="flex items-center gap-3">
        <p-checkbox 
          formControlName="keyGlobalPartner"
          [binary]="true" 
          id="keyGlobalPartner" />
        <label for="keyGlobalPartner">{{ "label.partner.keyGlobalPartner" | translate }}</label>
      </div>

      <!-- 2. UN & State entity -->
      <div class="flex items-center gap-3">
        <p-checkbox 
          formControlName="unAndStateEntity"
          [binary]="true" 
          id="unAndStateEntity" />
        <label for="unAndStateEntity">{{ "label.partner.unAndStateEntity" | translate }}</label>
      </div>

      <!-- 3. UN Secretariat Partner -->
      <div class="flex items-center gap-3">
        <p-checkbox 
          formControlName="unSecretariatPartner"
          [binary]="true" 
          id="unSecretariatPartner" />
        <label for="unSecretariatPartner">{{ "label.partner.unSecretariatPartner" | translate }}</label>
      </div>

      <!-- 4. Due Diligence (Required) -->
      <div class="flex flex-col gap-2">
        <label for="dueDiligenceRequired">{{ 'label.partner.dueDiligenceRequired' | translate }}</label>
        <p-select formControlName="dueDiligenceRequired" [options]="allYesNoData()"
                  optionLabel="name"
                  optionValue="id"
                  [placeholder]="'label.partner.selectDDRequired' | translate"
                  [appendTo]="'body'"
                  fluid="true" 
                  [showClear]="true"
                  id="dueDiligenceRequired"
                  [ariaLabel]="'aria.selectDueDiligenceRequired' | translate" />
      </div>

      <!-- 5. Due Diligence (Approval) -->
      <div class="flex flex-col gap-2">
        <label for="dueDiligenceApproval">{{ 'label.partner.dueDiligenceApproval' | translate }}</label>
        <p-select formControlName="dueDiligenceApproval" [options]="allYesNoData()"
                  optionLabel="name"
                  optionValue="id"
                  [placeholder]="'label.partner.selectDDEACDone' | translate"
                  [appendTo]="'body'"
                  fluid="true" 
                  [showClear]="true"
                  id="dueDiligenceApproval"
                  [ariaLabel]="'aria.selectDueDiligenceApproval' | translate" />
      </div>

      <!-- 6. Due Diligence Approval Date -->
      <div class="flex flex-col gap-2">
        <label for="dueDiligenceApprovalDate">{{ 'label.partner.dueDiligenceApprovalDate' | translate }}</label>
        <p-datepicker formControlName="dueDiligenceApprovalDate" 
                      fluid="true" id="dueDiligenceApprovalDate" />
      </div>

      <!-- 7. Due diligence expiry date -->
      <div class="flex flex-col gap-2">
        <label for="dueDiligenceExpiryDate">{{ 'label.partner.dueDiligenceExpiryDate' | translate }}</label>
        <p-datepicker formControlName="dueDiligenceExpiryDate" 
                      fluid="true" id="dueDiligenceExpiryDate" />
      </div>

      <!-- 8. Partner Approval Date -->
      <div class="flex flex-col gap-2">
        <label for="partnerApprovalDate">{{ 'label.partner.partnerApprovalDate' | translate }}</label>
        <p-datepicker formControlName="partnerApprovalDate" 
                      fluid="true" id="partnerApprovalDate" />
      </div>

      <!-- 9. Partner Approval Reference -->
      <div class="flex flex-col gap-2">
        <label for="partnerApprovalReference">{{ "label.partner.partnerApprovalReference" | translate }}</label>
        <input pInputText fluid="true" formControlName="partnerApprovalReference" id="partnerApprovalReference" />
      </div>

      <!-- 10. Partner Levy -->
      <div class="flex flex-col gap-2">
        <label for="partnerLevyStatus">{{ 'label.partner.partnerLevyStatus' | translate }}</label>
        <p-select formControlName="partnerLevyStatus" [options]="allPartnerLevyAppliesData()"
                  optionLabel="name"
                  optionValue="id"
                  [placeholder]="'label.partner.selectLevyPotentiallyApplies' | translate"
                  [appendTo]="'body'"
                  fluid="true" 
                  [showClear]="true"
                  id="partnerLevyStatus"
                  [ariaLabel]="'aria.selectPartnerLevyStatus' | translate" />
      </div>

      <!-- 11. Reason for Levy - Only show when Partner Levy is "DoesNotApply" or "PotentiallyNotApplied" -->
      @if (shouldShowReasonForLevy()) {
      <div class="flex flex-col gap-2">
        <label for="reasonForLevy">{{ 'label.partner.reasonForLevy' | translate }}</label>
        <p-select formControlName="reasonForLevy" [options]="allPartnerReasonForLevyNotData()"
                  optionLabel="name"
                  optionValue="id"
                  [placeholder]="'label.partner.selectReasonForLevyNotApplying' | translate"
                  [appendTo]="'body'"
                  fluid="true" 
                  [showClear]="true"
                  id="reasonForLevy"
                  [ariaLabel]="'aria.selectReasonForLevy' | translate" />
      </div>
      }

      <!-- 12. Levy Treatment -->
      <div class="flex flex-col gap-2">
        <label for="levyTreatment">{{ 'label.partner.levyTreatment' | translate }}</label>
        <p-select formControlName="levyTreatment" [options]="allPartnerLevyTreatmentData()"
                  optionLabel="name"
                  optionValue="id"
                  [placeholder]="'label.partner.selectLevyTreatment' | translate"
                  [appendTo]="'body'"
                  fluid="true" 
                  [showClear]="true"
                  id="levyTreatment"
                  [ariaLabel]="'aria.selectLevyTreatment' | translate" />
      </div>

      <!-- 13. Pooled Fund -->
      <div class="flex items-center gap-3">
        <p-checkbox 
          formControlName="pooledFund"
          [binary]="true" 
          id="pooledFund" />
        <label for="pooledFund">{{ "label.partner.pooledFund" | translate }}</label>
      </div>

      <!-- 14. Can create new opportunities? -->
      <div class="flex items-center gap-3">
        <p-checkbox 
          formControlName="canCreateNewOpportunities"
          [binary]="true" 
          id="canCreateNewOpportunities" />
        <label for="canCreateNewOpportunities">{{ "label.partner.canCreateNewOpportunities" | translate }}</label>
      </div>
    </div>

    <!-- 15. Reason (full width) -->
    <div class="flex flex-col gap-2">
      <label for="reasonForNoNewOpportunity">{{ 'label.partner.reasonForNoNewOpportunity' | translate }}</label>
      <textarea pTextarea formControlName="reasonForNoNewOpportunity" 
                fluid="true" id="reasonForNoNewOpportunity" rows="3"></textarea>
    </div>
  </form>

  <!-- Dialog Footer -->
  <div class="flex justify-end gap-3 pt-4 border-t">
    <p-button 
      label="{{ 'button.cancel' | translate }}"
      severity="secondary"
      (onClick)="handleCancel()"
      [disabled]="isLoading()" />
    
    <p-button 
      label="{{ 'button.approve' | translate }}"
      icon="pi pi-check"
      (onClick)="handleApprove()"
      [loading]="isLoading()" />
  </div>
</div>
