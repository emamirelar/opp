<form class="w-full h-full content-container" [formGroup]="formGroup">
    <p-panel
        [styleClass]="'section'"
      >
      <div class="flex flex-col justify-between">
        <div class="mb-6 pr-2">
            <label>{{ "label.partnerTree.id" | translate }}</label>
            <!--input pInputText fluid="true" formControlName="name" /-->
            <input pInputText fluid="true" formControlName="id" placeholder="Autopopulated" readonly/>
        </div>

        <div class="mb-6 pr-2">
          <label>{{ "label.partnerTree.name" | translate }}</label>
          <input pInputText fluid="true" formControlName="name" />
          <!--textarea rows="5" cols="30" pTextarea fluid="true" formControlName="name" ></textarea-->
        </div>

        <div class="mb-6 pr-2">
            <label>{{ "label.partnerTree.description" | translate }}</label>
            <!--input pInputText fluid="true" formControlName="name" /-->
            <textarea rows="5" cols="30" pTextarea fluid="true" formControlName="description" ></textarea>
        </div>

        <div class="mb-6 pr-2">
            <label>{{ "label.partnerTree.code" | translate }}</label>
            <!--input pInputText fluid="true" formControlName="name" /-->
            <input pInputText fluid="true" formControlName="code" [readonly]="record?.id !== null"/>
        </div>

        <div class="mb-6 pr-2">
            <label>{{ "label.partnerTree.type" | translate }}</label>
            <!--input pInputText fluid="true" formControlName="name" /-->
            <input pInputText fluid="true" formControlName="type" readonly/>
        </div>

        <div class="mb-6 pr-2">
            <label>{{ "label.partnerTree.parent" | translate }}</label>
            <input pInputText fluid="true" formControlName="parent" readonly/>
        </div>
        <div class="mb-6 pr-2">
            <label>{{ "label.partnerTree.status" | translate }}</label>
            <!--input pInputText fluid="true" formControlName="name" /-->
            <p-select
                formControlName="status"
                [options]="allStatusData()"
                optionLabel="name"
                optionValue="id"
                fluid="true"
                [showClear]="true"
                placeholder="Select a Status"
            />
        </div>
      </div>
    </p-panel>
    <div class="flex justify-end mt-2">

      <p-button icon="pi pi-save" severity="success" class="mr-2 mb-2" label="{{'button.save' | translate}}" (click)="record?.id !== null ? _handleOnSaveClick() : _handleOnCreateClick()"/>
      <p-button icon="pi pi-trash" *ngIf="record?.status === 'Active' && record?.id !== null" severity="warn" label="{{'button.inactive' | translate}}" (click)="_handleOnDeleteClick()"/>
      <p-button icon="pi pi-trash" *ngIf="record?.status === 'Inactive' && record?.id !== null" severity="warn" label="{{'button.active' | translate}}" (click)="_handleOnSaveClick(true)"/>
      
    </div>
</form>
