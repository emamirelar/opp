<div class="flex flex-col gap-8">
  <div class="flex gap-4 items-center">
    <div class="text-2xl font-semibold">Partner Tree</div>
    <div class="grow"></div>
    <p-button icon="pi pi-plus" label="New Partner Level" (onClick)="onCreateNewPartnerLevel()"/>
  </div>
  <div class="table-container">
    <p-treetable
      [loading]="service.isLoading()"
      #treetable
      (onEditComplete)="onEditComplete($event)"
      [value]="data"
      [columns]="cols"
      showGridlines
      [tableStyle]="{ 'min-width': '50rem' }"
    >
      <ng-template #header let-columns>
        <tr>
          <th *ngFor="let col of columns">
            {{ col.label  | translate }}
          </th>
        </tr>
      </ng-template>
      <ng-template #body let-rowNode let-rowData="rowData" let-columns="columns">
        <tr [ttRow]="rowNode" [pEditableRow]="rowData" [class.!bg-lime-50]="isRecordUpdated(rowNode)">
          <td *ngFor="let col of columns; let i = index; let last = last" [ttEditableColumn]="col.id" [ttEditableColumnField]="rowData">
            <p-treeTableToggler [rowNode]="rowNode" *ngIf="i === 0" class="mr-2" />
            <p-button icon="pi pi-plus" *ngIf="i === 0 && rowData['type'] !== 'Level_3'" rounded="true" outlined severity="primary"  class="mr-2" (onClick)="onAddPartnerLevel(rowData)"/>
            <span *ngIf="col.editable === false || (col.id === 'parent' && rowData[col.id] === ''); else editableBlock">{{rowData[col.id]}} </span>
            <ng-template #editableBlock>
              <p-treeTableCellEditor>
                <ng-template pTemplate="input">
                  <ng-container *ngIf="col.id === 'parent'; else textInput">
                    {{rowData[col.id]}}
                  </ng-container>
                  <ng-template #textInput>
                    <textarea rows="5" cols="30" pTextarea fluid="true" [(ngModel)]="rowData[col.id]" [ngStyle]="{'width': i == 0 ? '90%': '100%'}"></textarea>
                  </ng-template>
                </ng-template>
                <ng-template pTemplate="output" class="p-cell-editor-output">
                  {{rowData[col.id]}}
                </ng-template>
              </p-treeTableCellEditor>
            </ng-template>
            <ng-container *ngIf="last">
              <p-button icon="pi pi-eye" rounded="true" severity="success" class="mr-2" outlined (onClick)="updatePartnerLevel = true; changeRecord = rowData;"/>
            </ng-container>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="7" class="text-center py-6">
            <div class="flex flex-col items-center gap-3">
              <i class="pi pi-inbox text-4xl text-gray-300"></i>
              <span class="text-gray-500">{{ 'message.noRecordsFound' | translate }}</span>
            </div>
          </td>
        </tr>
      </ng-template>

    </p-treetable>
  </div>
  @if (updatedRecords.length > 0) {
    <div class="flex justify-end gap-2 sticky bottom-0 bg-white py-4 -mt-2">
      <p-button icon="pi pi-refresh" label="Revert Changes" outlined="" severity="warn" (onClick)="handleOnRevertClick()"/>
      <p-button icon="pi pi-check" label="Save Updates" severity="success" (onClick)="handleOnSaveClick()"/>
    </div>
  }
</div>

<app-partner-tree-item
  *ngIf="createPartnerLevel"
  [record]="changeRecord"
  (onRecordUpdateSuccess)="handleOnRecordUpdation($event)"
  (closeModal)="createPartnerLevel = false; changeRecord = null;"
></app-partner-tree-item>

<app-partner-tree-item
  *ngIf="updatePartnerLevel"
  [record]="changeRecord"
  (onRecordUpdateSuccess)="handleOnRecordUpdation($event)"
  (closeModal)="updatePartnerLevel = false; changeRecord = null;"
></app-partner-tree-item>
