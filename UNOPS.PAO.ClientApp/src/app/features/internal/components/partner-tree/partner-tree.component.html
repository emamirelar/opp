<p-treetable [value]="files" [columns]="cols" [scrollable]="true" [tableStyle]="{ 'min-width': '50rem' }">
    <ng-template #caption><div class="text-xl font-bold">Partner Tree</div> </ng-template>
    <ng-template #header let-columns>
        <tr>
            <th *ngFor="let col of columns">
                {{ col.header }}
            </th>
        </tr>
    </ng-template>
    <ng-template #body let-rowNode let-rowData="rowData" let-columns="columns">
        <tr [ttRow]="rowNode" [pEditableRow]="rowData">
            <td *ngFor="let col of columns; let i = index; let last = last" ttEditableColumn>
                <p-treeTableToggler [rowNode]="rowNode" *ngIf="i === 0" />
                <p-treeTableCellEditor> 
                    <ng-template pTemplate="input"> 
                        <input pInputText type="text" 
                        [(ngModel)]="rowData[col.field]"  
                        [ngStyle]= 
                        "{'width': i == 0 ? '90%': '100%'}"> 
                    </ng-template> 

                    <ng-template pTemplate="output"> 
                        {{rowData[col.field]}} 
                    </ng-template> 
              </p-treeTableCellEditor> 
                <!--ng-container *ngIf="last">
                    <p-button icon="pi pi-pencil" rounded="true" severity="success" />
                </ng-container-->
            </td>
        </tr>
    </ng-template>
    <ng-template #summary>
        <div style="text-align:left">
            <p-button icon="pi pi-refresh" label="Revert Changes" severity="warn" class="mb-6 pr-2"/>
            <p-button icon="pi pi-save" label="Save" severity="success" class="mb-6 pr-2" (onclick)="handleOnSaveClick()"/>
        </div>
    </ng-template>
</p-treetable>
