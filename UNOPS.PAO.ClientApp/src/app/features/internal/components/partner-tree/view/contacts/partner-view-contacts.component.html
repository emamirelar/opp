<p-panel>
  <ng-template pTemplate="header">
    <div class="flex justify-between items-center w-full">
      <div class="font-semibold text-xl">Contacts</div>
      <div>
        <p-button
          icon="pi pi-window-maximize"
          [text]="true"
          [rounded]="true"
          (onClick)="openFullScreenContacts()"
          tooltipPosition="left"
          pTooltip="View all contacts">
        </p-button>
      </div>
    </div>
  </ng-template>

  @if (partnerId) {
    <!-- Loading state -->
    @if (isLoading()) {
      <div class="flex justify-center items-center py-4">
        <i class="pi pi-spin pi-spinner text-2xl"></i>
      </div>
    } @else {
      <!-- Grouped by letter view -->
      <div class="flex flex-col bg-white rounded-lg p-4 gap-2">
        @if (contacts.length === 0) {
          <div class="text-center py-4">No contacts found</div>
        } @else {
          <!-- Alphabetical sections -->
          @for (group of groupedContacts; track group.letter) {
            <div class="border border-gray-200">
              <div class="flex items-center justify-between py-2">
                <div class="flex items-center gap-2 px-3">
                  <span class="font-semibold">{{group.letter}}</span>
                </div>
              </div>
              <div class="py-2">
                @for (contact of group.contacts; track contact.id) {
                  <div class="border-b border-gray-100 last:border-b-0">
                    <app-partner-view-contacts-item
                      [contact]="contact"
                      (itemClick)="openContactView($event)">
                    </app-partner-view-contacts-item>
                  </div>
                }
              </div>
            </div>
          }
        }
      </div>
    }
  }
</p-panel>
