<p-dialog
  [(visible)]="visible"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [closable]="!isSubmitting()"
  [style]="{ width: '600px' }"
  [contentStyle]="{ 'padding-top': '1rem' }"
>
  <ng-template pTemplate="header">
    <div class="flex items-center gap-2">
      <i class="pi pi-check-circle text-xl" style="color: #10b981;"></i>
      <span class="font-semibold text-lg">
        {{ 'workflow.goDecision.dialog.approve.title' | translate }}
      </span>
    </div>
  </ng-template>

  <div class="flex flex-col gap-4">
    <!-- Confirmation Statement Section (Light Blue Box) -->
    <div>
      <label class="font-semibold block mb-2">{{ 'workflow.goDecision.dialog.approve.confirmationLabel' | translate }} *</label>
      <div class="p-4 rounded-lg flex items-start gap-3" style="background-color: #e3f2fd; border: 1px solid rgba(0, 146, 209, 0.2);">
        <p-checkbox
          [binary]="true"
          [ngModel]="confirmationAcknowledged()"
          (ngModelChange)="onConfirmationChange($event)"
          inputId="confirmationCheckbox"
          [disabled]="isSubmitting()"
        />
        <label for="confirmationCheckbox" class="leading-relaxed cursor-pointer" style="color: #007bb8;" [innerHTML]="confirmationStatement()">
        </label>
      </div>
    </div>

    <!-- Decision Rationale -->
    <div class="flex flex-col gap-2">
      <label class="font-semibold">{{ 'workflow.goDecision.dialog.approve.rationaleLabel' | translate }} *</label>
      <textarea
        pTextarea
        id="rationale"
        [ngModel]="decisionRationale()"
        (ngModelChange)="onRationaleChange($event)"
        [rows]="4"
        [autoResize]="true"
        [disabled]="isSubmitting()"
        class="w-full"
        [placeholder]="'workflow.goDecision.dialog.approve.rationalePlaceholder' | translate"
      ></textarea>
      <div class="flex items-center gap-2 text-sm" style="color: #7a7c7e;">
        <i class="pi pi-info-circle"></i>
        <span>{{ 'workflow.goDecision.dialog.approve.rationaleHint' | translate }}</span>
      </div>
    </div>

    <!-- Executive Selection -->
    <div class="flex flex-col gap-2">
      <label class="font-semibold">{{ 'workflow.goDecision.dialog.approve.executiveLabel' | translate }} *</label>
      <p-select
        id="executive"
        [options]="executives()"
        optionLabel="label"
        optionValue="value"
        [ngModel]="selectedExecutiveId()"
        (ngModelChange)="onExecutiveChange($event)"
        [filter]="executives().length > 5"
        filterBy="label"
        [disabled]="isSubmitting() || isLoadingExecutives()"
        [loading]="isLoadingExecutives()"
        [placeholder]="isLoadingExecutives() ? ('common.loading' | translate) : ''"
        appendTo="body"
        class="w-full"
      />
      <small style="color: #7a7c7e;">
        {{ 'workflow.goDecision.dialog.approve.executiveHint' | translate }}
      </small>
    </div>

    <!-- Info Notice (Light Blue Box) -->
    <div class="p-4 rounded-lg flex items-start gap-2" style="background-color: #e3f2fd; border: 1px solid rgba(0, 146, 209, 0.2);">
      <i class="pi pi-info-circle" style="color: #005a8a;"></i>
      <p class="m-0" style="color: #005a8a;">
        {{ 'workflow.goDecision.dialog.approve.infoNotice' | translate }}
      </p>
    </div>
  </div>

  <ng-template pTemplate="footer">
    <div class="flex justify-end gap-2">
      <p-button
        [label]="'button.cancel' | translate"
        severity="secondary"
        [outlined]="true"
        (onClick)="onCancel()"
        [disabled]="isSubmitting()"
      />
      <p-button
        [label]="'workflow.goDecision.dialog.approve.confirmButton' | translate"
        icon="pi pi-check"
        severity="success"
        (onClick)="onSubmit()"
        [disabled]="!canSubmit() || isSubmitting()"
        [loading]="isSubmitting()"
      />
    </div>
  </ng-template>
</p-dialog>
