<div class="px-3 py-2 hover:bg-gray-50 cursor-pointer" (click)="onContactClick()">
  <div class="flex items-center gap-3">
    <div class="flex-shrink-0">
      <img *ngIf="contact.profilePictureUrl" 
           [src]="contact.profilePictureUrl" 
           (error)="onImageError($event)"
           class="h-10 w-10 rounded-full object-cover" 
           alt="Profile picture">
      <img *ngIf="!contact.profilePictureUrl" 
           src="assets/images/Contact.png"
           class="h-10 w-10 rounded-full object-cover" 
           alt="Default profile picture">
    </div>
    <div class="flex-grow min-w-0">
      <div class="font-medium text-gray-900">{{contact.firstName}} {{contact.lastName}}</div>
      <div *ngIf="contact.title" class="text-unops-sm text-gray-500">{{contact.title}}</div>
      <div *ngIf="contact.email" class="text-unops-sm text-gray-500 truncate">{{contact.email}}</div>
    </div>
  </div>
</div>
