<div class="flex flex-col h-full gap-4">
  <!-- Search and filter section -->
  <div class="flex flex-col md:flex-row gap-4 items-center">
    <p-iconfield class="w-full">
      <p-inputicon styleClass="pi pi-search" />
      <input
        type="text"
        pInputText
        class="w-full"
        placeholder="Search contacts..."
        [(ngModel)]="searchTextModel"
        (input)="onSearchTextChange($event)">
    </p-iconfield>
  </div>

  <!-- Grouped contacts with infinite scroll -->
  <div class="flex-grow overflow-y-auto" #scrollContainer (scroll)="onScroll($event)">
    @for (group of displayedGroups; track group.letter) {
      <div class="border border-gray-200 mb-3">
        <div class="flex items-center bg-white px-3 py-2 rounded-lg overflow-hidden">
          <div class="flex items-center gap-2">
            <span class="font-semibold">{{group.letter}}</span>
          </div>
        </div>
        <div class="py-2">
          @for (contact of group.contacts; track contact.id) {
            <div class="border-b border-gray-100 last:border-b-0">
              <app-partner-view-contacts-item
                [contact]="contact"
                (itemClick)="openContactView($event)">
              </app-partner-view-contacts-item>
            </div>
          } @empty {
            <div class="text-center py-4">No contacts found</div>
          }
        </div>
      </div>
    } @empty {
      @if (!isLoading()) {
        <div class="flex flex-col items-center justify-center h-64">
          <i class="pi pi-inbox text-unops-display-large text-gray-300 mb-4"></i>
          <p class="text-gray-500 text-unops-xl">No contacts found</p>
          <p class="text-gray-400">Try adjusting your search or filters</p>
        </div>
      }
    }
    @if (isLoading()) {
      <div class="flex justify-center py-4 h-full items-center">
        <p-progressSpinner strokeWidth="4" [style]="{width: '50px', height: '50px'}"></p-progressSpinner>
      </div>
    }
  </div>
</div>
