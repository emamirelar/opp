<div class="layout-sidebar">
    @if (isInternalUser()) {
        @if (isAdmin()) {
            <app-menu [model]="combinedMenuItems"></app-menu>
        } @else {
            <app-menu [model]="menuItems"></app-menu>
        }
    } @else {
        <app-menu [model]="externalMenuItems"></app-menu>
    }
</div>
