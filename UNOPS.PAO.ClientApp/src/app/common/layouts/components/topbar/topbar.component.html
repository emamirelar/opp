<div class="layout-topbar">
	<div class="layout-topbar-logo-container">
		<button pButton pRipple type="button" class="p-link layout-menu-button" (click)="layoutService.onMenuToggle()">
			<i class="pi pi-bars"></i>
		</button>
		<a class="layout-topbar-logo"
			routerLink="/">
			<img src="images/Circle.png"
				class="brand-logo"
				alt="UNOPS Grant+ Logo">
			<span class="text-sm sm:text-2xl">Opportunity+</span>
		</a>
	</div>

	<div class="layout-topbar-actions">
		<div class="flex items-center">
      <!--				<app-theme-toggler></app-theme-toggler>-->

      <!-- Dev Login link - only visible in development mode -->
      <button *ngIf="isDevelopment" 
			type="button"
			aria-label="Dev Login"
			class="layout-topbar-action p-button-text mr-1"
            (click)="navigateToDevLogin()"
            pTooltip="Dev Login" tooltipPosition="bottom">
			<i class="pi pi-user-edit"></i>
            <span class="dev-login-badge">DEV</span>
      </button>

      <!-- Debug link - only visible in development mode -->
      <button *ngIf="isDevelopment" 
			type="button"
			aria-label="Debug"
			class="layout-topbar-action p-button-text mr-1"
            (click)="navigateToDebug()"
            pTooltip="Debug Info" tooltipPosition="bottom">
			<i class="pi pi-cog"></i>
            <span class="debug-badge">DEBUG</span>
      </button>

      <app-language-selector></app-language-selector>
	  <button (click)="layoutService.onAIAssistantToggle()"
			type="button"
			aria-label="Language Selector"
			class="layout-topbar-action p-button-text">
			<img src="images/AI_visual_64.svg" alt="AI Assistant" class="size-6" />
		</button>
      <button type="button"
			aria-label="Notifications"
			class="layout-topbar-action p-button-text"
      pButton
      (click)="notificationPanel.toggle($event)">
			<i class="pi pi-bell"></i>
        <span *ngIf="unreadCount > 0" class="notification-badge">{{unreadCount}}</span>
		</button>
      <p-overlayPanel #notificationPanel [style]="{width: '400px'}">
        <div class="notification-panel">
          <div class="notification-header">
            <h3>Notifications</h3>
          </div>
          <div class="notification-list">
            <div *ngFor="let notification of notifications" 
                 class="notification-item" 
                 [ngClass]="{'notification-progress': notification.status === 'Progress'}"
                 (click)="notification.category !== 'file_analysis' ? handleNotificationClick(notification) : null">
              <div class="notification-content">
                <!-- Progress status indicator -->
                <div *ngIf="notification.status === 'Progress'" class="notification-progress-indicator">
                  <p-progressBar mode="indeterminate" [style]="{'height': '6px'}"></p-progressBar>
                </div>
                
                <!-- For messages with progress bars embedded in the text -->
                <p *ngIf="notification.message && notification.message.includes('[')">
                  <span [innerHTML]="formatProgressMessage(notification.message)"></span>
                </p>
                
                <!-- Regular message -->
                <p *ngIf="!notification.message || !notification.message.includes('[')">
                  {{notification.message}}
                </p>
                
                <!-- Cancel button for file analysis operations in progress -->
                <div *ngIf="notification.category === 'file_analysis' && notification.status === 'Progress'" 
                     class="notification-actions">
                  <p-button icon="pi pi-times" 
                            label="Cancel" 
                            severity="secondary" 
                            size="small"
                            (onClick)="cancelFileAnalysis(notification, $event)"></p-button>
                </div>
              </div>
            </div>
            <div *ngIf="notifications.length === 0" class="no-notifications">
              No notifications
            </div>
          </div>
        </div>
      </p-overlayPanel>
      <div class="layout-topbar-menu">
        <div class="flex align-items-center gap-2">
          <p-avatar 
            [label]="getInitials()" 
            styleClass="cursor-pointer" 
            (click)="menu.toggle($event)">
          </p-avatar>
          <p-menu #menu [popup]="true" [model]="profileMenuItems"></p-menu>
        </div>
      </div>
		</div>
	</div>

	<p-toast position="bottom-right"></p-toast>
</div>

<app-profile-dialog #profileDialog></app-profile-dialog>
