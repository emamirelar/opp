<div class="layout-topbar flex justify-between gap-4 items-center">
	<div class="layout-topbar-logo-container flex items-center">
		<button pButton pRipple type="button" text class="p-link layout-menu-button flex-shrink-0 menu-toggle-button" (click)="onMenuButtonClick()">
			<i class="pi pi-bars"></i>
		</button>
		<a class="flex-shrink-0 cursor-pointer transition-opacity duration-200 hover:opacity-80 homepage-logo"
			routerLink="/"
			(click)="navigateToHome()"
			title="Go to Homepage"
			aria-label="Navigate to Homepage">
			<img src="images/PNG/Opportunity Horizontal1000px.png"
				class="hidden lg:block flex-shrink-0  w-48"
				alt="UNOPS Opportunity+ Logo">
			<img src="images/PNG/Opportunity Logo Graphic1000px.png"
				class="lg:hidden w-6 flex-shrink-0"
				alt="UNOPS Opportunity+ Logo">
		</a>
	</div>

	<!-- Search bar container -->
	<div class="flex items-center gap-2 flex-1 max-w-2xl global-search-container">
		<app-global-search-bar (searchExpanded)="onSearchExpanded($event)"></app-global-search-bar>
	</div>

	<div class="flex items-center justify-end" [class.search-expanded-hide-mobile]="isSearchExpanded">
		<!-- Tour Button -->
		<app-tour-control [class.search-expanded-hide-mobile]="isSearchExpanded"></app-tour-control>
		
		<!-- Global Filters button (moved before globe icon) -->
		<p-button
			type="button"
			[rounded]="true"
			[text]="true"
			aria-label="Global Filters"
			styleClass="!w-10 !h-10 !p-0 flex items-center justify-center relative"
			(onClick)="openGlobalFilters()"
			title="Global Filters"
			class="global-filters-button">
			<ng-template pTemplate="content">
				<i class="pi pi-sliders-h text-xl"></i>
				<span *ngIf="isOrgUnitFilterActive" class="org-unit-filter-badge"></span>
			</ng-template>
		</p-button>
		
      <app-language-selector class="language-selector"></app-language-selector>
	  		
		<!-- Chat History Button (only visible on AI page) -->
		<p-button
			*ngIf="isOnAiPage()"
			(onClick)="chatHistoryPanel.toggle($event)"
			type="button"
			[rounded]="true"
			[text]="true"
			ariaLabel="Chat History"
			styleClass="!w-10 !h-10 !p-0 flex items-center justify-center chat-history-btn"
			pTooltip="Chat History"
			tooltipPosition="bottom"
			class="chat-history-toggle">
			<ng-template pTemplate="content">
				<i class="pi pi-history text-xl"></i>
			</ng-template>
		</p-button>
		
		<p-button
			(onClick)="onAIAssistantToggle()"
			type="button"
			[rounded]="true"
			[text]="true"
			[ariaLabel]="isMobile ? 'Open AI Assistant Page' : 'Toggle AI Assistant Panel'"
			data-ai-assistant-toggle
			styleClass="!w-10 !h-10 !p-0 flex items-center justify-center ai-assistant-toggle-btn"
			[class.hidden-on-mobile]="isOnAiPage()"
			[pTooltip]="isMobile ? 'Open AI Assistant Page' : 'Toggle AI Assistant Panel'"
			tooltipPosition="bottom"
			class="ai-assistant-toggle">
			<ng-template pTemplate="content">
				<img src="images/AI_visual_64.svg" alt="AI Assistant" class="w-6 h-6" />
			</ng-template>
		</p-button>
		
      <div class="relative notifications-container">
			<p-button
				type="button"
				[rounded]="true"
				[text]="true"
				aria-label="Notifications"
				styleClass="!w-10 !h-10 !p-0 flex items-center justify-center"
				(onClick)="notificationPanel.toggle($event)"
				class="notifications-button">
				<ng-template pTemplate="content">
					<i class="pi pi-bell text-xl"></i>
				</ng-template>
			</p-button>
			
			<!-- Notification badge positioned outside the button -->
			<span *ngIf="unreadCount > 0" class="notification-badge" [attr.data-count]="unreadCount">{{getDisplayCount()}}</span>
		</div>
      <p-overlayPanel #notificationPanel [style]="{width: '400px'}">
        <div class="notification-panel">
          <div class="notification-header">
            <h3>Notifications</h3>
          </div>
          <div class="notification-list">
            <div *ngFor="let notification of notifications" 
                 class="notification-item" 
                 [ngClass]="{'notification-progress': notification.status === 'Progress'}"
                 (click)="notification.category !== 'file_analysis' ? handleNotificationClick(notification) : null">
              <div class="notification-content">
                <!-- Progress status indicator -->
                <div *ngIf="notification.status === 'Progress'" class="notification-progress-indicator">
                  <p-progressBar mode="indeterminate" [style]="{'height': '6px'}"></p-progressBar>
                </div>
                
                <!-- For messages with progress bars embedded in the text -->
                <p *ngIf="notification.message && notification.message.includes('[')">
                  <span [innerHTML]="formatProgressMessage(notification.message)"></span>
                </p>
                
                <!-- Regular message -->
                <p *ngIf="!notification.message || !notification.message.includes('[')">
                  {{notification.message}}
                </p>
                
                <!-- Cancel button for file analysis operations in progress -->
                <div *ngIf="notification.category === 'file_analysis' && notification.status === 'Progress'" 
                     class="notification-actions">
                  <p-button icon="pi pi-times" 
                            label="Cancel" 
                            severity="secondary" 
                            size="small"
                            (onClick)="cancelFileAnalysis(notification, $event)"></p-button>
                </div>
              </div>
            </div>
            <div *ngIf="notifications.length === 0" class="no-notifications">
              No notifications
            </div>
          </div>
        </div>
      </p-overlayPanel>
      
      <!-- Chat History Panel -->
      <p-overlayPanel #chatHistoryPanel [style]="{width: '400px', maxHeight: '500px'}">
        <div class="chat-history-panel">
          <div class="chat-history-header">
            <h3>Chat History</h3>
            <p-button 
              icon="pi pi-plus" 
              label="New Chat" 
              size="small"
              (onClick)="startNewChat(); chatHistoryPanel.hide()"
              [disabled]="isNewChatDisabled"
              class="new-chat-btn">
            </p-button>
          </div>
          
          <!-- Search -->
          <div class="chat-search-container" *ngIf="chatSessions.length > 0">
            <div class="search-input-wrapper">
              <input 
                type="text" 
                [(ngModel)]="chatSearchQuery"
                (input)="onChatSearchInput($event)"
                placeholder="Search chats..."
                class="search-input"
              />
              <i class="pi pi-search search-icon"></i>
              <button 
                *ngIf="chatSearchQuery"
                (click)="clearChatSearch()"
                class="clear-search-btn"
                type="button">
                <i class="pi pi-times"></i>
              </button>
            </div>
          </div>
          
          <div class="chat-history-list">
            <div *ngIf="isLoadingChatSessions" class="loading-message">
              <div class="loading-spinner"></div>
              <span>Loading chats...</span>
            </div>
            
            <div *ngIf="!isLoadingChatSessions && chatSessions.length === 0" class="no-chats-message">
              <span class="text-sm text-gray-500">No chat history yet</span>
            </div>
            
            <div *ngFor="let session of filteredChatSessions; trackBy: trackByChatId" 
                 class="chat-history-item"
                 [class.active]="isSelectedChatSession(session)"
                 (click)="openChatSession(session); chatHistoryPanel.hide()">
              <div class="chat-item-content">
                <div class="chat-title">{{ session.title || 'Untitled Chat' }}</div>
                <div class="chat-date">{{ formatChatDate(session.lastUpdated) }}</div>
              </div>
              <div class="chat-item-actions">
                <button 
                  class="star-btn"
                  [class.starred]="session.starred"
                  (click)="toggleChatStar(session, $event)"
                  title="{{session.starred ? 'Unstar' : 'Star'}} this chat">
                  <i class="pi" [ngClass]="session.starred ? 'pi-star-fill' : 'pi-star'"></i>
                </button>
              </div>
            </div>
            
            <div *ngIf="!isLoadingChatSessions && filteredChatSessions.length === 0 && chatSessions.length > 0" class="no-results-message">
              <span class="text-sm text-gray-500">No chats match your search</span>
            </div>
          </div>
        </div>
      </p-overlayPanel>
      
      <div class="ml-auto">
        <div class="flex items-center gap-2">
          <p-button
                type="button"
                [rounded]="true"
                [text]="true"
                styleClass="!w-10 !h-10 !p-0 flex items-center justify-center"
                (onClick)="menu.toggle($event)"
                class="profile-menu-button">
            <ng-template pTemplate="content">
              <i class="pi pi-user text-xl"></i>
            </ng-template>
          </p-button>
          <p-menu #menu [popup]="true" [model]="profileMenuItems"></p-menu>
        </div>
      </div>
	</div>
</div>
<p-toast position="bottom-right"></p-toast>
<app-role-dialog></app-role-dialog>
<app-profile-dialog></app-profile-dialog>

<!-- Global Filters Dialog -->
<app-global-filters-dialog></app-global-filters-dialog>
