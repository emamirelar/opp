<div class="layout-topbar flex justify-between gap-4 items-center">
	<div class="layout-topbar-logo-container flex items-center">
		<button pButton pRipple type="button" text class="p-link layout-menu-button flex-shrink-0" (click)="onMenuButtonClick()">
			<i class="pi pi-bars"></i>
		</button>
		<a class="flex-shrink-0"
			routerLink="/">
			<img src="images/PNG/Opportunity Horizontal1000px.png"
				class="hidden lg:block flex-shrink-0  w-48"
				alt="UNOPS Opportunity+ Logo">
			<img src="images/PNG/Opportunity Logo Graphic1000px.png"
				class="lg:hidden w-6 flex-shrink-0"
				alt="UNOPS Opportunity+ Logo">
		</a>
	</div>

	<!-- Search bar container -->
	<div class="flex items-center gap-2 flex-1 max-w-2xl">
		<app-global-search-bar></app-global-search-bar>
	</div>

	<div class="flex items-center justify-end">
		<!-- Global Filters button (moved before globe icon) -->
		<p-button
			type="button"
			[rounded]="true"
			[text]="true"
			aria-label="Global Filters"
			styleClass="!w-10 !h-10 !p-0 flex items-center justify-center relative mr-2"
			(onClick)="openGlobalFilters()"
			title="Global Filters">
			<ng-template pTemplate="content">
				<i class="pi pi-sliders-h text-xl"></i>
				<span *ngIf="isOrgUnitFilterActive" class="org-unit-filter-badge"></span>
			</ng-template>
		</p-button>
		
      <app-language-selector></app-language-selector>
	  <p-button
			(onClick)="layoutService.onAIAssistantToggle()"
			type="button"
			[rounded]="true"
			[text]="true"
			aria-label="AI Assistant Toggle"
			data-ai-assistant-toggle
			styleClass="!w-10 !h-10 !p-0 flex items-center justify-center ai-assistant-toggle-btn"
			[class.hidden-on-mobile]="isOnAiPage()">
			<ng-template pTemplate="content">
				<img src="images/AI_visual_64.svg" alt="AI Assistant" class="w-6 h-6" />
			</ng-template>
		</p-button>
      <p-button
			type="button"
			[rounded]="true"
			[text]="true"
			aria-label="Notifications"
			styleClass="!w-10 !h-10 !p-0 flex items-center justify-center relative"
			(onClick)="notificationPanel.toggle($event)">
			<ng-template pTemplate="content">
				<i class="pi pi-bell text-xl"></i>
				<span *ngIf="unreadCount > 0" class="notification-badge">{{unreadCount}}</span>
			</ng-template>
		</p-button>
      <p-overlayPanel #notificationPanel [style]="{width: '400px'}">
        <div class="notification-panel">
          <div class="notification-header">
            <h3>Notifications</h3>
          </div>
          <div class="notification-list">
            <div *ngFor="let notification of notifications" 
                 class="notification-item" 
                 [ngClass]="{'notification-progress': notification.status === 'Progress'}"
                 (click)="notification.category !== 'file_analysis' ? handleNotificationClick(notification) : null">
              <div class="notification-content">
                <!-- Progress status indicator -->
                <div *ngIf="notification.status === 'Progress'" class="notification-progress-indicator">
                  <p-progressBar mode="indeterminate" [style]="{'height': '6px'}"></p-progressBar>
                </div>
                
                <!-- For messages with progress bars embedded in the text -->
                <p *ngIf="notification.message && notification.message.includes('[')">
                  <span [innerHTML]="formatProgressMessage(notification.message)"></span>
                </p>
                
                <!-- Regular message -->
                <p *ngIf="!notification.message || !notification.message.includes('[')">
                  {{notification.message}}
                </p>
                
                <!-- Cancel button for file analysis operations in progress -->
                <div *ngIf="notification.category === 'file_analysis' && notification.status === 'Progress'" 
                     class="notification-actions">
                  <p-button icon="pi pi-times" 
                            label="Cancel" 
                            severity="secondary" 
                            size="small"
                            (onClick)="cancelFileAnalysis(notification, $event)"></p-button>
                </div>
              </div>
            </div>
            <div *ngIf="notifications.length === 0" class="no-notifications">
              No notifications
            </div>
          </div>
        </div>
      </p-overlayPanel>
      <div class="ml-auto">
        <div class="flex items-center gap-2">
          <p-button
                type="button"
                [rounded]="true"
                [text]="true"
                styleClass="!w-10 !h-10 !p-0 flex items-center justify-center"
                (onClick)="menu.toggle($event)">
            <ng-template pTemplate="content">
              <i class="pi pi-user text-xl"></i>
            </ng-template>
          </p-button>
          <p-menu #menu [popup]="true" [model]="profileMenuItems"></p-menu>
        </div>
      </div>
	</div>
</div>
<p-toast position="bottom-right"></p-toast>
<app-role-dialog></app-role-dialog>
<app-profile-dialog></app-profile-dialog>

<!-- Global Filters Dialog -->
<app-global-filters-dialog></app-global-filters-dialog>
