<div class="relative">
  <!-- Single Search Input -->
  <div class="flex items-center w-full">
    <p-iconfield iconPosition="left" class="w-full">
      <p-inputicon class="pi pi-search"></p-inputicon>
      <input pInputText 
        type="text" 
        class="w-full h-10" 
        [(ngModel)]="searchText" 
        (input)="onInput($event)"
        (keydown)="onKeydown($event)"
        (blur)="onBlur($event)" 
        #searchInput>
    </p-iconfield>
  </div>

  <!-- Active Search Criteria -->
  <div class="mt-2 flex flex-wrap gap-2">
    @for (criterion of activeCriteria; track criterion) {
      <p-chip 
        [label]="getCriterionLabel(criterion)"
        [removable]="true"
        (onRemove)="removeCriterion(criterion)">
      </p-chip>
    }
  </div>

  <!-- Smart Suggestions -->
  @if (showSuggestions) {
    <div class="absolute z-50 w-full mt-1 bg-white rounded-md shadow-lg max-h-60 overflow-y-auto border border-gray-200" #suggestionsContainer>
      @for (suggestion of suggestions; track suggestion; let i = $index) {
        <div class="px-4 py-2 cursor-pointer hover:bg-gray-100 flex items-center gap-2" 
          [class.bg-gray-100]="i === selectedSuggestionIndex"
          (mousedown)="applySuggestion(suggestion)">
          @switch (suggestionType) {
            @case ('field') {
              <i class="pi pi-tag text-blue-500"></i>
            }
            @case ('operator') {
              <i class="pi pi-arrows-h text-green-500"></i>
            }
            @case ('value') {
              <i class="pi pi-pencil text-gray-500"></i>
            }
            @case ('logical') {
              <i class="pi pi-link text-purple-500"></i>
            }
          }
          <span>{{ suggestion }}</span>
        </div>
      }
    </div>
  }
</div>
