<p-button 
  type="button"
  [rounded]="true"
  [text]="true"
  [ariaLabel]="'tour.control.takeATour' | translate"
  styleClass="!w-10 !h-10 !p-0 flex items-center justify-center mr-2"
  [pTooltip]="'tour.control.takeATour' | translate"
  tooltipPosition="bottom"
  (click)="detectTour()"
  [title]="'tour.control.takeATour' | translate">
  <ng-template pTemplate="content">
    <i class="pi pi-play-circle text-xl"></i>
  </ng-template>
</p-button>
