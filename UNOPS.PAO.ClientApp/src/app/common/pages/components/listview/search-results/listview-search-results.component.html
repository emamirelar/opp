@if (viewMode === 'table') {
  <app-listview-table
    [columns]="columns"
    [config]="config"
    [data]="currentPageData()"
    [totalRecords]="totalRecordsCount()"
    [loading]="isLoading()"
    [error]="hasError()"
    [first]="first"
    [rows]="rows"
    (pageChange)="onPageChange($event)"
    (sortChange)="onSortChange($event)"
    (rowClick)="onRowClick($event)"
  />
}


<!-- Card view -->
@if (viewMode === 'card') {
  <app-listview-card
    [columns]="columns"
    [config]="config"
    [data]="currentPageData()"
    [totalRecords]="totalRecordsCount()"
    [loading]="isLoading()"
    [error]="hasError()"
    [first]="first"
    [rows]="rows"
    (pageChange)="onPageChange($event)"
    (sortChange)="onSortChange($event)"
    (rowClick)="onRowClick($event)"
  />
}
