<p-dialog
  [(visible)]="visible"
  [header]="(link ? 'title.editLink' : 'title.addLink') | translate"
  [modal]="true"
  [style]="{width: '25vw'}"
  [draggable]="false"
  [resizable]="false"
  (onHide)="close()">
  <div class="flex flex-col gap-4">
    <div class="flex flex-col gap-2">
      <label for="url">{{ 'label.link.url' | translate }}</label>
      <input
        id="url"
        type="text"
        pInputText
        [(ngModel)]="newLink.url"
        [placeholder]="'placeholder.enterUrl' | translate" />
    </div>
    <div class="flex flex-col gap-2">
      <label for="description">{{ 'label.link.description' | translate }}</label>
      <textarea
        id="description"
        pTextarea
        [(ngModel)]="newLink.description"
        [rows]="3"
        [placeholder]="'placeholder.enterDescription' | translate"></textarea>
    </div>
  </div>
  <ng-template pTemplate="footer">
    <div class="flex justify-between w-full">
      <div>
        @if (link) {
          <p-button
            icon="pi pi-trash"
            severity="danger"
            rounded
            text
            (onClick)="deleteLink()" />
        }
      </div>
      <div class="flex gap-2">
        <p-button
          [label]="'button.cancel' | translate"
          icon="pi pi-times"
          rounded
          (onClick)="close()"
          styleClass="p-button-text" />
        <p-button
          [label]="'button.save' | translate"
          icon="pi pi-check"
          rounded
          (onClick)="saveLink()"
          [disabled]="!newLink.url" />
      </div>
    </div>
  </ng-template>
</p-dialog>
