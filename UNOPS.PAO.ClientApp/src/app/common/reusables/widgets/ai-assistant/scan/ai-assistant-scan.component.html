<p-dialog
  [visible]="showWebcam()"
  (visibleChange)="showWebcam.set($event)"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{width: '90vw', maxWidth: '640px'}"
  (onHide)="stopCamera()"
  header="{{ 'aiAssistant.takePhoto' | translate }}">

  <div class="flex flex-col gap-4">
    <div class="relative w-full aspect-video bg-black rounded-lg overflow-hidden">
      <video #video class="w-full h-full object-cover" autoplay playsinline></video>
      <div class="absolute inset-0 flex items-center justify-center">
        <div class="w-4/5 h-3/5 border-2 border-white/50 rounded-lg shadow-[0_0_0_9999px_rgba(0,0,0,0.5)]"></div>
      </div>
    </div>

    <div class="flex justify-end gap-2">
      <p-button
        icon="pi pi-times"
        (onClick)="stopCamera()"
        label="{{ 'common.cancel' | translate }}"
        styleClass="p-button-secondary">
      </p-button>
      <p-button
        icon="pi pi-camera"
        (onClick)="captureImage()"
        
        label="{{ 'common.capture' | translate }}">
      </p-button>
    </div>
  </div>
</p-dialog>

<canvas #canvas class="hidden"></canvas>
