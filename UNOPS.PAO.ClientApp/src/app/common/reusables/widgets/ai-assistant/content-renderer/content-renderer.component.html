<div class="content-item" [ngSwitch]="item.type" *ngIf="shouldShow">
  <!-- Markdown content without typewriter effect -->
  <div *ngSwitchCase="'markdown'" class="content-markdown">
    <markdown [data]="getStringMessage()"></markdown>
  </div>
  
  <!-- Thought content with different styling -->
  <div *ngSwitchCase="'thoughts'" class="content-thought">
    <markdown [data]="getStringMessage()"></markdown>
  </div>
  
  <!-- Grid/Table content -->
  <div *ngSwitchCase="'grid'" class="fade-in-content content-grid">
    <div class="content-type-header">
      <span class="content-type-label">{{ getContentTypeLabel() }}</span>
    </div>
    <app-entity-grid 
      [entityType]="item.entity || 'Item'"
      [gridData]="getArrayMessage()"
      (cardClicked)="cardClicked.emit($event)">
    </app-entity-grid>
  </div>
  
  <!-- Card content (using same grid component) -->
  <div *ngSwitchCase="'card'" class="fade-in-content content-card">
    <div class="content-type-header">
      <span class="content-type-label">{{ getContentTypeLabel() }}</span>
    </div>
    <app-entity-grid 
      [entityType]="item.entity || 'Item'"
      [gridData]="getArrayMessage()"
      (cardClicked)="cardClicked.emit($event)">
    </app-entity-grid>
  </div>
  
  <!-- Chart.js charts -->
  <div *ngSwitchCase="'chartjs'" class="chartjs-container fade-in-content content-chartjs">
    <div class="content-type-header">
      <span class="content-type-label">{{ getContentTypeLabel() }}</span>
    </div>
    <app-chart-js 
      [chartType]="getChartType()"
      [chartConfig]="getChartConfig()"
      [chartData]="getChartData()">
    </app-chart-js>
  </div>
  
  <!-- Mermaid diagram -->
  <div *ngSwitchCase="'mermaid'" class="mermaid-container fade-in-content content-mermaid">
    <div class="content-type-header">
      <span class="content-type-label">{{ getContentTypeLabel() }}</span>
    </div>
    <div #mermaidElement class="mermaid">{{ getStringMessage() }}</div>
  </div>
  
  <!-- Code block -->
  <div *ngSwitchCase="'code'" class="code-container fade-in-content content-code">
    <div class="content-type-header">
      <span class="content-type-label">{{ getContentTypeLabel() }}</span>
    </div>
    <pre><code [class]="'language-' + (item.language || 'javascript')">{{ getStringMessage() }}</code></pre>
  </div>
  
  <!-- Plain text fallback without typewriter effect -->
  <div *ngSwitchDefault class="text-content content-text">
    <markdown [data]="getStringMessage()"></markdown>
  </div>
</div>
