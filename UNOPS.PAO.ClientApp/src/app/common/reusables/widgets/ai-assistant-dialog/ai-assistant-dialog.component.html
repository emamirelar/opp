<!-- Fixed chat button -->
<div 
  class="fixed bottom-8 w-16 h-16 right-8 z-50 border border-solid border-gray-50 bg-white rounded-full shadow-md flex items-center justify-center cursor-pointer transition-all duration-300 hover:shadow-lg hover:scale-110 active:scale-95"
  (click)="toggleChat()"
  role="button"
  aria-label="Open AI Assistant">
  <i class="pi pi-sparkles !text-3xl"></i>
</div>

<!-- AI Assistant dialog -->
<p-dialog
  [(visible)]="visible"
  [header]="'AI Assistant'"
  [style]="{width: '500px'}"
  [modal]="false"
  [draggable]="false"
  [resizable]="false"
  [closeOnEscape]="true"
  position="bottomright">

  <ng-template pTemplate="header">
    <div class="flex justify-between items-center w-full">
      <span class="text-xl">AI Assistant</span>
      <p-button
        icon="pi pi-refresh"
        (onClick)="clearHistory()"
        [text]="true"
        [rounded]="true"
        pTooltip="New conversation"
        [disabled]="chatHistory.length === 0"
        tooltipPosition="left">
      </p-button>
    </div>
  </ng-template>

  <div class="flex flex-col h-full">
    <!-- Chat messages -->
      <div #chatContainer 
           class="p-2.5 space-y-2.5 relative min-h-[300px]"
           (dragover)="onDragOver($event)"
           (dragleave)="onDragLeave($event)"
           (drop)="onDrop($event)"
           [ngClass]="{'bg-blue-50 border-2 border-dashed border-blue-300': isDragging}">
        <div *ngIf="isDragging" class="absolute inset-0 flex items-center justify-center bg-blue-50 bg-opacity-70 z-10">
          <div class="text-blue-600 flex flex-col items-center">
            <i class="pi pi-upload text-3xl mb-2"></i>
            <span>Drop files here</span>
          </div>
        </div>
        <div *ngFor="let msg of chatHistory"
             class="flex flex-col"
             [ngClass]="msg.isUser ? 'items-end' : 'items-start'">
          <div class="p-2.5 rounded-xl max-w-[80%] break-words shadow-sm"
               [ngClass]="!msg.isUser ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-800'">
            <p class="text-sm">{{ msg.text }}</p>
            <!-- Display files if any -->
            <div *ngIf="msg.files && msg.files.length > 0" class="mt-2 border-t border-opacity-20"
                 [ngClass]="msg.isUser ? 'border-white' : 'border-gray-300'">
              <div *ngFor="let file of msg.files" class=" mt-1.5 flex items-center gap-1">
                <span class="pi pi-file"></span>
                <span>{{ file.name }}</span>
              </div>
            </div>
            <small class=" opacity-70 mt-1.5 block text-right">{{ msg.timestamp | date:'shortTime' }}</small>
          </div>
        </div>
        <div *ngIf="chatHistory.length === 0" class="text-center text-gray-500 p-5">
          <p>How can I assist you today?</p>
          <p class="mt-2 text-sm text-blue-500">
            <i class="pi pi-info-circle mr-1"></i>
            You can drag and drop files directly into this chat
          </p>
        </div>
      </div>

  </div>
  <ng-template pTemplate="footer">
      <div class="flex-col flex w-full gap-2 mt-2">
          <div *ngIf="selectedFiles.length > 0" class="mt-2 p-2 bg-gray-100 rounded-md shadow-sm">
              <div class="text-sm font-medium mb-1 text-gray-700">Files to send:</div>
              <div class="max-h-24 overflow-y-auto">
                  <div *ngFor="let file of selectedFiles; let i = index" class="flex items-center justify-between  py-1 hover:bg-gray-200 rounded px-1">
                      <div class="flex items-center gap-1">
                          <span class="pi pi-file text-blue-500"></span>
                          <span class="truncate max-w-[180px]">{{ file.name }}</span>
                      </div>
                      <div class="flex gap-2">
                          <p-button
                                  icon="pi pi-times"
                                  rounded="true"
                                  outlined="true"
                                  pTooltip="Remove file"
                                  (click)="removeFile(i)">
                          </p-button >
                      </div>
                  </div>
              </div>
          </div>
          <div class="w-full flex gap-2">

      <textarea
              pTextarea
              [(ngModel)]="message"
              placeholder="Type your message..."
              [rows]="1"

              [autoResize]="true"
              class="w-full resize-none border-0 focus:ring-0 focus:outline-none"
              (keydown.enter)="$event.preventDefault(); sendMessage()">
      </textarea>

              <p-button
                      icon="pi pi-send"
                      (click)="sendMessage()"
                      [text]="true"
                      [disabled]="!message.trim() && selectedFiles.length === 0">
              </p-button>
              <p-fileUpload
                      mode="basic"
                      chooseIcon="pi pi-paperclip"
                      [chooseLabel]="''"
                      [auto]="true"
                      [maxFileSize]="10000000"
                      [showUploadButton]="false"
                      [showCancelButton]="false"
                      [disabled]="isProcessingFile"
                      (onSelect)="onFileSelect($event)"
                      accept="image/*,application/pdf,text/*">

                  <ng-template #header let-files let-chooseCallback="chooseCallback" let-clearCallback="clearCallback" let-uploadCallback="uploadCallback">
                              <p-button (onClick)="onFileSelect($event)" icon="pi pi-images" [rounded]="true" [outlined]="true" />
                  </ng-template>
              </p-fileUpload>
          </div>
      </div>
  </ng-template>

</p-dialog>
