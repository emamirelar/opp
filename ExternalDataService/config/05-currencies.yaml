metadata:
  name: "currencies"
  description: "Currency master data sync from ERP"
  version: "1.0"
  enabled: true
  max_retry_attempts: 1
  timeout_minutes: 5

source:
  type: "bigquery"
  
  query: |
    SELECT
      Currency
      , Currency_Description AS Name
      , 1 AS Status
      , CURRENT_TIMESTAMP() as last_modified
    FROM
      `unopsreporting.General_Ledger.Currency`
    WHERE
      Currency_System_Status = 'N'
  
  primary_key_field: "Currency"
  batch_size: 1000

destination:
  table_name: "Currencies"
  schema: "public"
  manage_table_structure: true
  add_standard_fields: true
  
  field_mappings:
    - source_field: "Name"
      destination_field: "Name"  # Needed to implement IBaseBusinessEntity
      data_type: "varchar(255)"
      is_required: true

    - source_field: "Status"
      destination_field: "Status"  # Needed to implement IBaseBusinessEntity
      data_type: "integer"         # Must be integer (IBaseBusinessEntity requirement)
      is_required: false

    - source_field: "Currency"
      destination_field: "Code"
      data_type: "varchar(3)"
      is_required: true
      is_unique: true

sync_options:
  sync_mode: Upsert
  batch_processing: true
  use_bulk_upsert: true  # Requires unique Code; run AddUniqueConstraintsForTables migration

validation:
  required_source_fields:
    - "Currency"
    - "Name"
  
error_handling:
  on_connection_error: RetryWithBackoff
  on_mapping_error: SkipRecord

logging:
  log_level: "Debug"
  log_sql_queries: true
  log_record_details: true

