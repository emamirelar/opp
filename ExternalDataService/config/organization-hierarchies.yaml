metadata:
  name: "OrganizationHierarchies Sync"
  description: "Organization Hierarchies data sync"
  version: "1.0"
  enabled: true
  max_retry_attempts: 1
  timeout_minutes: 5

source:
  type: "bigquery"
    
  query: |
    WITH ORG AS (
      SELECT
        *
      FROM
        `unopsreporting.Organisation.Organisational_Structures`
      WHERE
        CAST(Effective_Date AS DATE) = CURRENT_DATE()
      )

      , OFFICE AS (
      SELECT
        1 AS Id
        , 'OPS' AS Code
        , 'OPS - United Nations Office for Project Services' AS Name
        , 'Office' AS Type
        , 'United Nations Office for Project Services' AS Description
        , NULL AS ParentId
        , 1 AS Status
        , 0 AS CreatedBy
        , CURRENT_TIMESTAMP() AS CreatedDate
        , 0 AS LastModifiedBy
        , CURRENT_TIMESTAMP() AS LastModifiedDate
        , FALSE AS IsDeleted
        , 0 AS DeletedBy
        , NULL AS DeletedDate
        , FALSE AS IsSelfManagementEnabled
        , 1 AS HierarchyLevel
      )

      , REGION AS (
      SELECT DISTINCT
        MOD(ABS(FARM_FINGERPRINT(Region)), 2147483647) AS Id
        , Region AS Code
        , CONCAT(Region, " ", Region_Description) AS Name
        , 'Region' AS Type
        , Region_Description AS Description
        , 1 AS ParentId
        , (CASE WHEN System_Status = 'N' THEN 1 ELSE 0 END) AS Status
        , 0 AS CreatedBy
        , CURRENT_TIMESTAMP() AS CreatedDate
        , 0 AS LastModifiedBy
        , CURRENT_TIMESTAMP() AS LastModifiedDate
        , FALSE AS IsDeleted
        , 0 AS DeletedBy
        , NULL AS DeletedDate
        , FALSE AS IsSelfManagementEnabled
        , 2 AS HierarchyLevel
      FROM
        ORG
      WHERE
        Region > ''
      )

      , HUB AS (
      SELECT DISTINCT
        MOD(ABS(FARM_FINGERPRINT(Hub)), 2147483647) AS Id
        , Hub AS Code
        , CONCAT(Hub, " ", Hub_Description) AS Name
        , 'Hub' AS Type
        , Hub_Description AS Description
        , MOD(ABS(FARM_FINGERPRINT(Region)), 2147483647) AS ParentId
        , (CASE WHEN System_Status = 'N' THEN 1 ELSE 0 END) AS Status
        , 0 AS CreatedBy
        , CURRENT_TIMESTAMP() AS CreatedDate
        , 0 AS LastModifiedBy
        , CURRENT_TIMESTAMP() AS LastModifiedDate
        , FALSE AS IsDeleted
        , 0 AS DeletedBy
        , NULL AS DeletedDate
        , FALSE AS IsSelfManagementEnabled
        , 3 AS HierarchyLevel
      FROM
        ORG
      WHERE
        Hub > ''
        AND Region > ''
      )

      , ORG_UNIT AS (
      SELECT DISTINCT
        MOD(ABS(FARM_FINGERPRINT(Org_Unit)), 2147483647) AS Id
        , Org_Unit AS Code
        , CONCAT(Org_Unit, " ", Org_Unit_Description) AS Name
        , 'OrgUnit' AS Type
        , Org_Unit_Description AS Description
        , (CASE
            WHEN Hub > '' THEN MOD(ABS(FARM_FINGERPRINT(Hub)), 2147483647)
            ELSE MOD(ABS(FARM_FINGERPRINT(Region)), 2147483647)
          END) AS ParentId
        , (CASE WHEN System_Status = 'N' THEN 1 ELSE 0 END) AS Status
        , 0 AS CreatedBy
        , CURRENT_TIMESTAMP() AS CreatedDate
        , 0 AS LastModifiedBy
        , CURRENT_TIMESTAMP() AS LastModifiedDate
        , FALSE AS IsDeleted
        , 0 AS DeletedBy
        , NULL AS DeletedDate
        , FALSE AS IsSelfManagementEnabled
        , 4 AS HierarchyLevel
      FROM
        ORG
      WHERE
        Org_Unit > ''
        AND (Hub > '' OR Region > '')
      )

      , ALL_ORG AS (
      SELECT
        *
      FROM
        OFFICE
      UNION ALL
      SELECT
        *
      FROM
        REGION
      UNION ALL
      SELECT
        *
      FROM
        HUB
      UNION ALL
      SELECT
        *
      FROM
        ORG_UNIT
      ORDER BY
        HierarchyLevel ASC
        , Id ASC
      )

      SELECT
        * EXCEPT(HierarchyLevel)
      FROM
        ALL_ORG
      ;
  
  primary_key_field: "Id"
  batch_size: 1000

destination:
  table_name: "OrganizationHierarchies"
  schema: "public"
  manage_table_structure: false
  add_standard_fields: false
  
  field_mappings:
    - source_field: "Id"
      destination_field: "Id"
      data_type: "integer"
      is_unique: true
      is_required: true

    - source_field: "Code"
      destination_field: "Code"
      data_type: "varchar(50)"
      is_unique: true
      is_required: true

    - source_field: "Name"
      destination_field: "Name"
      data_type: "varchar(50)"
      is_required: true
    
    - source_field: "Type"
      destination_field: "Type"
      data_type: "varchar(50)"
      is_required: false
    
    - source_field: "Description"
      destination_field: "Description"
      data_type: "varchar(500)"
      is_required: false
    
    - source_field: "ParentId"
      destination_field: "ParentId"
      data_type: "integer"
      is_required: false

    - source_field: "Status"
      destination_field: "Status"
      data_type: "integer"
      is_required: false
    
    - source_field: "CreatedBy"
      destination_field: "CreatedBy"
      data_type: "integer"
      is_required: false

    - source_field: "CreatedDate"
      destination_field: "CreatedDate"
      data_type: "timestamp"
      is_required: false
      insert_only: true
    
    - source_field: "LastModifiedBy"
      destination_field: "LastModifiedBy"
      data_type: "integer"
      is_required: false
    
    - source_field: "LastModifiedDate"
      destination_field: "LastModifiedDate"
      data_type: "timestamp"
      is_required: false
    
    - source_field: "IsDeleted"
      destination_field: "IsDeleted"
      data_type: "boolean"
      is_required: false

    - source_field: "DeletedBy"
      destination_field: "DeletedBy"
      data_type: "integer"
      is_required: false
    
    - source_field: "DeletedDate"
      destination_field: "DeletedDate"
      data_type: "timestamp"
      is_required: false
        
    - source_field: "IsSelfManagementEnabled"
      destination_field: "IsSelfManagementEnabled"
      data_type: "boolean"
      is_required: false

sync_options:
  sync_mode: Upsert
  batch_processing: true

validation:
  required_source_fields:
    - "Id"
    - "Code"
    - "Name"
  
error_handling:
  on_connection_error: RetryWithBackoff
  on_mapping_error: SkipRecord

logging:
  log_level: "Debug"
  log_sql_queries: true
  log_record_details: true
