metadata:
  name: "Partners Test Sync"
  description: "Local development test for partner data sync"
  version: "1.0"
  enabled: true
  # No schedule for manual testing
  max_retry_attempts: 1
  timeout_minutes: 5

source:
  type: "bigquery"
  connection:
    project_id: "unops-dev-project"
    use_environment_auth: true
  
  query: |
    SELECT 
      'TEST-' || CAST(ROW_NUMBER() OVER (ORDER BY RAND()) as STRING) as external_id,
      partner_name,
      'US' as country_code,
      'AMERICAS' as region_code,
      contact_email,
      'Active' as status,
      CURRENT_TIMESTAMP() as created_date
    FROM (
      SELECT 'Acme Corporation' as partner_name, 'contact@acme.com' as contact_email
      UNION ALL
      SELECT 'Global Partners Inc', 'info@globalpartners.com'
      UNION ALL
      SELECT 'Development Solutions LLC', 'hello@devsolutions.com'
      UNION ALL
      SELECT 'Innovation Hub', 'contact@innovationhub.org'
      UNION ALL
      SELECT 'Tech for Good', 'team@techforgood.org'
    ) sample_data
  
  primary_key_field: "external_id"
  batch_size: 5  # Small batches for testing

destination:
  table_name: "TestExternalPartners"
  schema: "integration"
  
  field_mappings:
    - source_field: "external_id"
      destination_field: "ExternalId"
      data_type: "varchar(100)"
      is_required: true
      is_unique: true
    
    - source_field: "partner_name"
      destination_field: "Name"
      data_type: "varchar(255)"
      is_required: true
      transformations:
        - type: "trim"
        - type: "title_case"
    
    - source_field: "contact_email"
      destination_field: "ContactEmail"
      data_type: "varchar(255)"
      is_required: false
      transformations:
        - type: "lowercase"
        - type: "validate_email"
    
    - source_field: "status"
      destination_field: "Status"
      data_type: "varchar(50)"
      is_required: true
      default_value: "Active"
    
    - source_field: "created_date"
      destination_field: "ExternalCreatedDate"
      data_type: "timestamp"
      is_required: false

  foreign_key_mappings:
    - source_field: "country_code"
      lookup_table: "Countries"
      lookup_field: "CountryCode"
      destination_field: "CountryId"
      lookup_return_field: "Id"
      is_required: false
      on_lookup_fail: LogWarning  # Don't fail in development
    
    - source_field: "region_code"
      lookup_table: "GeoRegions"
      lookup_field: "RegionCode"
      destination_field: "RegionId"
      lookup_return_field: "Id"
      is_required: false
      on_lookup_fail: SetNull

sync_options:
  sync_mode: Upsert
  batch_processing: true

validation:
  required_source_fields:
    - "external_id"
    - "partner_name"

error_handling:
  on_connection_error: RetryWithBackoff
  on_mapping_error: SkipRecord
  
logging:
  log_level: "Debug"
  log_sql_queries: true
  log_record_details: true  # Enable for development debugging
