metadata:
  name: "engagements"
  description: "Engagements data sync"
  version: "1.0"
  enabled: true
  max_retry_attempts: 1
  timeout_minutes: 5

source:
  type: "bigquery"

  query: |
    WITH ENG AS (
      SELECT
        *
      FROM
        `unopsreporting.Engagements.Engagement` E
      WHERE
        E.Engagement_Stage NOT IN ('CANCELLED')
        AND EXTRACT(YEAR FROM E.Engagement_Implementation_Start_Date) > 1900
        AND E.Latest_Finalised_Flag = 'Yes'
    )
    , SDG AS (
      SELECT DISTINCT
        E.Engagement
        , ES.Primary_SDG_Contribution_Flag
        , ES.SDG
        , CONCAT('SDG ', ES.SDG, ': ', ES.SDG_Description) AS SDG_Name
      FROM
        ENG E

        CROSS JOIN UNNEST(E.SDGs) AS ES
      ORDER BY
        ES.Primary_SDG_Contribution_Flag DESC
        , ES.SDG
    )
    SELECT
      E.Base_Engagement
      , E.Engagement_Implementation_Start_Date
      , E.Engagement_Implementation_End_Date
      , E.Engagement_Signed_Date
      , E.Engagement_Amount
      , E.Engagement_Stage
      , E.Engagement_Stage_Description
      , E.Business_Developer
      , E.Business_Developer_Name
      , E.Business_Developer_Email_Address
      , E.Engagement_Project_Executive
      , E.Engagement_Project_Executive_Name
      , IFNULL(E.Implementation_Countries_Description_Concatenated, '') AS Implementation_Countries_List
      , IFNULL(ARRAY_TO_STRING(ARRAY_AGG(DISTINCT EO.Output_Description ORDER BY EO.Output_Description), ', ', ''), '') AS Outputs_List
      , IFNULL(ARRAY_TO_STRING(ARRAY_AGG(DISTINCT SDG.SDG_Name), ', ', ''), '') AS SDG_List
      , IFNULL(E.Engagement_Description, '') AS Engagement_Description
      , IFNULL(E.Engagement_Long_Description, '') AS Engagement_Long_Description
      , (CASE E.Base_Engagement_Stage
          WHEN 'CLOSED' THEN 2
          WHEN 'CANCELLED' THEN 4
          WHEN 'OPP' THEN 3
          WHEN 'CLOSING' THEN 1
          WHEN 'IMPLEMENTATION' THEN 1
          WHEN 'PENDING_IMPL' THEN 3
          WHEN 'AWARD' THEN 1
          WHEN 'PRE-ENG' THEN 3
          WHEN 'INIT' THEN 3
          ELSE 0 END) AS Status
      --, E.Opportunity_Id
      , CURRENT_TIMESTAMP() as last_modified
    FROM
      ENG E

      CROSS JOIN UNNEST(E.Outputs) AS EO

      INNER JOIN SDG
      ON SDG.Engagement = E.Engagement
    GROUP BY
      E.Base_Engagement
      , E.Engagement_Implementation_Start_Date
      , E.Engagement_Implementation_End_Date
      , E.Engagement_Signed_Date
      , E.Engagement_Amount
      , E.Engagement_Stage
      , E.Engagement_Stage_Description
      , E.Business_Developer
      , E.Business_Developer_Name
      , E.Business_Developer_Email_Address
      , E.Engagement_Project_Executive
      , E.Engagement_Project_Executive_Name
      , E.Engagement_Project_Executive_Name
      , E.Implementation_Countries_Description_Concatenated
      , E.Engagement_Description
      , E.Engagement_Long_Description
      , E.Base_Engagement_Stage
      --, E.Opportunity_Id
  
  primary_key_field: "Base_Engagement"
  batch_size: 1000

destination:
  table_name: "BaseEngagements"
  schema: "public"
  manage_table_structure: true
  add_standard_fields: true
  
  field_mappings:
    - source_field: "Base_Engagement"
      destination_field: "Name"  # Needed to implement BaseBusinessEntity
      data_type: "varchar(50)"
      is_required: false

    - source_field: "Status"
      destination_field: "Status"  # Needed to implement BaseBusinessEntity
      data_type: "integer"         # Must be integer (BaseBusinessEntity requirement)
      is_required: false

    - source_field: "Base_Engagement"
      destination_field: "BaseEngagement"
      data_type: "varchar(50)"
      is_required: true
      is_unique: true
    
    - source_field: "Engagement_Implementation_Start_Date"
      destination_field: "EngagementImplementationStartDate"
      data_type: "date"
      is_required: false
    
    - source_field: "Engagement_Implementation_End_Date"
      destination_field: "EngagementImplementationEndDate"
      data_type: "date"
      is_required: false
    
    - source_field: "Engagement_Signed_Date"
      destination_field: "EngagementSignedDate"
      data_type: "date"
      is_required: false
    
    - source_field: "Engagement_Amount"
      destination_field: "EngagementAmount"
      data_type: "decimal(18,2)"
      is_required: false
    
    - source_field: "Engagement_Stage"
      destination_field: "EngagementStage"
      data_type: "varchar(100)"
      is_required: false
    
    - source_field: "Engagement_Stage_Description"
      destination_field: "EngagementStageDescription"
      data_type: "varchar(500)"
      is_required: false
    
    - source_field: "Business_Developer"
      destination_field: "BusinessDeveloper"
      data_type: "varchar(255)"
      is_required: false
    
    - source_field: "Business_Developer_Name"
      destination_field: "BusinessDeveloperName"
      data_type: "varchar(255)"
      is_required: false
    
    - source_field: "Business_Developer_Email_Address"
      destination_field: "BusinessDeveloperEmailAddress"
      data_type: "varchar(255)"
      is_required: false
    
    - source_field: "Engagement_Project_Executive"
      destination_field: "EngagementProjectExecutive"
      data_type: "varchar(255)"
      is_required: false
    
    - source_field: "Engagement_Project_Executive_Name"
      destination_field: "EngagementProjectExecutiveName"
      data_type: "varchar(255)"
      is_required: false
    
    - source_field: "Implementation_Countries_List"
      destination_field: "ImplementationCountriesList"
      data_type: "text"
      is_required: false
    
    - source_field: "Outputs_List"
      destination_field: "OutputsList"
      data_type: "text"
      is_required: false
    
    - source_field: "SDG_List"
      destination_field: "SDGList"
      data_type: "text"
      is_required: false
    
    - source_field: "Engagement_Description"
      destination_field: "EngagementDescription"
      data_type: "text"
      is_required: false
    
    - source_field: "Engagement_Long_Description"
      destination_field: "EngagementLongDescription"
      data_type: "text"
      is_required: false
    
    - source_field: "Opportunity_Id"
      destination_field: "OpportunityId"
      data_type: "integer"
      is_required: false

sync_options:
  sync_mode: Upsert
  batch_processing: true

validation:
  required_source_fields:
    - "Base_Engagement"
    - "Engagement_Description"
  
error_handling:
  on_connection_error: RetryWithBackoff
  on_mapping_error: SkipRecord

logging:
  log_level: "Debug"
  log_sql_queries: true
  log_record_details: true
