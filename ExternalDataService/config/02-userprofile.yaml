metadata:
  name: "user-profiles"
  description: "UserProfile data sync"
  version: "1.0"
  enabled: true
  max_retry_attempts: 1
  timeout_minutes: 30

source:
  type: "bigquery"
  
  query: |
    SELECT
      PARSE_NUMERIC(Resource) as Id
      , PARSE_NUMERIC(Resource) as UserId
      , CONCAT(First_Name, " ", Middle_Name, " ", Surname) as Name
      , 1 as Status
      , 0 as CreatedBy
      , CURRENT_DATETIME() as CreatedDate
      , 0 as LastModifiedBy
      , CURRENT_DATETIME() as LastModifiedDate
      , FALSE as IsDeleted
      , 0 as DeletedBy
      , NULL as DeletedDate
      , Surname as LastName
      , First_Name as FirstName
      , CONCAT(Duty_Station_Description, ' - ', Duty_Station_Country_Description) as DutyStation
      , Org_Unit_Work_At as OrgUnit
      , Position_Description as Position
      , Supervisor as SupervisorId
      , Resource_Email_Address_Primary as UserEmail
    FROM
      unopsreporting.Employment.People_Search_Report
    WHERE
      Effective_Date = CURRENT_DATE()
      AND Employment_Status = 'N'
      AND Employment_Type IN ('OPSSTAFF', 'OPSNONSTAFF', 'EXTAFFILIATE')
      AND UPPER(Resource_Email_Address_Primary) LIKE '%UNOPS.ORG'
    QUALIFY ROW_NUMBER() OVER (
        PARTITION BY PARSE_NUMERIC(Resource)
        ORDER BY Resource_Email_Address_Primary
      ) = 1

  
  primary_key_field: "UserId"
  batch_size: 1000

destination:
  table_name: "UserProfile"
  schema: "public"
  manage_table_structure: false  # Only validate, don't create/alter
  add_standard_fields: false

  # UserId comes directly from field_mappings (source value = AspNetUsers.Id).
  # No FK lookup needed - the value is already correct; DB FK constraint validates on insert.
  # (03-aspnetuserroles needs FK lookup because UserId is not in its field_mappings.)

  # UserProfile has UserId as PK with unique IX_UserProfile_UserId - one row per user.
  # Use UserId only as conflict target; (UserId, Id) causes duplicate inserts when existing row has Id=0.
  # UserId from FK mapping; add to field_mappings with is_unique for correct ON CONFLICT (UserId) upsert.
  
  field_mappings:
    - source_field: "UserId"
      destination_field: "UserId"
      data_type: "integer"
      is_required: true
      is_unique: true

    - source_field: "Id"
      destination_field: "Id"
      data_type: "integer"
      is_required: true

    - source_field: "Name"
      destination_field: "Name"
      data_type: "varchar(255)"
      is_required: true

    - source_field: "Status"
      destination_field: "Status"
      data_type: "integer"
      is_required: true

    - source_field: "CreatedBy"
      destination_field: "CreatedBy"
      data_type: "integer"
      is_required: false

    - source_field: "CreatedDate"
      destination_field: "CreatedDate"
      data_type: "timestamp"
      is_required: false
      insert_only: true  # Preserve existing CreatedDate to maintain creation date

    - source_field: "LastModifiedBy"
      destination_field: "LastModifiedBy"
      data_type: "integer"
      is_required: false

    - source_field: "LastModifiedDate"
      destination_field: "LastModifiedDate"
      data_type: "timestamp"
      is_required: false

    - source_field: "IsDeleted"
      destination_field: "IsDeleted"
      data_type: "boolean"
      is_required: false

    - source_field: "DeletedBy"
      destination_field: "DeletedBy"
      data_type: "integer"
      is_required: false
      
    - source_field: "DeletedDate"
      destination_field: "DeletedDate"
      data_type: "timestamp"
      is_required: false

    - source_field: "LastName"
      destination_field: "LastName"
      data_type: "varchar(255)"
      is_required: false

    - source_field: "FirstName"
      destination_field: "FirstName"
      data_type: "varchar(255)"
      is_required: false

    - source_field: "DutyStation"
      destination_field: "DutyStation"
      data_type: "varchar(255)"
      is_required: false

    - source_field: "OrgUnit"
      destination_field: "OrgUnit"
      data_type: "varchar(255)"
      is_required: false

    - source_field: "Position"
      destination_field: "Position"
      data_type: "varchar(255)"
      is_required: false

    - source_field: "SupervisorId"
      destination_field: "SupervisorId"
      data_type: "integer"
      is_required: false

    - source_field: "UserEmail"
      destination_field: "UserEmail"
      data_type: "varchar(255)"
      is_required: false

sync_options:
  sync_mode: Upsert
  batch_processing: true
  use_bulk_upsert: true   # Uses ON CONFLICT (UserId) - matches IX_UserProfile_UserId

validation:
  required_source_fields:
    - "UserId"
    - "Name"
  
error_handling:
  on_connection_error: RetryWithBackoff
  on_mapping_error: SkipRecord

logging:
  log_level: "Debug"
  log_sql_queries: true
  log_record_details: true
