metadata:
  name: "ASPNetUsers Sync"
  description: "ASPNetUsers data sync"
  version: "1.0"
  enabled: false
  max_retry_attempts: 1
  timeout_minutes: 5

source:
  type: "bigquery"
  
  query: |
    SELECT DISTINCT
      Resource as Id
      , true as IsInternal
      , Resource_Email_Address_Primary as UserName
      , UPPER(Resource_Email_Address_Primary) AS NormalizedUserName
      , Resource_Email_Address_Primary as Email
      , UPPER(Resource_Email_Address_Primary) AS NormalizedEmail
      , true as EmailConfirmed
      , NULL AS PasswordHash
      , NULL as SecurityStamp
      , NULL as ConcurrencyStamp
      , NULL as PhoneNumber
      , false as PhoneNumberConfirmed
      , false as TwoFactorEnabled
      , NULL as LockoutEnd
      , true as LockoutEnabled
      , 0 as AccessFailedCount
    FROM
      unopsreporting.Employment.People_Search_Report
    WHERE
      Effective_Date = CURRENT_DATE()
      QUALIFY ROW_NUMBER() OVER (
          PARTITION BY Resource_Email_Address_Primary
        ) = 1
  
  primary_key_field: "Id"
  batch_size: 1000

destination:
  table_name: "AspNetUsers"
  schema: "public"
  
  field_mappings:
    - source_field: "Base_Engagement"
      destination_field: "Name"  # Needed to implement BaseBusinessEntity
      data_type: "varchar(50)"
      is_required: false

    - source_field: "Status"
      destination_field: "Status"  # Needed to implement BaseBusinessEntity
      data_type: "integer"         # Must be integer (BaseBusinessEntity requirement)
      is_required: false

    - source_field: "Base_Engagement"
      destination_field: "BaseEngagement"
      data_type: "varchar(50)"
      is_required: true
      is_unique: true
    
    - source_field: "Engagement_Implementation_Start_Date"
      destination_field: "EngagementImplementationStartDate"
      data_type: "date"
      is_required: false
    
    - source_field: "Engagement_Implementation_End_Date"
      destination_field: "EngagementImplementationEndDate"
      data_type: "date"
      is_required: false
    
    - source_field: "Engagement_Signed_Date"
      destination_field: "EngagementSignedDate"
      data_type: "date"
      is_required: false
    
    - source_field: "Engagement_Amount"
      destination_field: "EngagementAmount"
      data_type: "decimal(18,2)"
      is_required: false
    
    - source_field: "Engagement_Stage"
      destination_field: "EngagementStage"
      data_type: "varchar(100)"
      is_required: false
    
    - source_field: "Engagement_Stage_Description"
      destination_field: "EngagementStageDescription"
      data_type: "varchar(500)"
      is_required: false
    
    - source_field: "Business_Developer"
      destination_field: "BusinessDeveloper"
      data_type: "varchar(255)"
      is_required: false
    
    - source_field: "Business_Developer_Name"
      destination_field: "BusinessDeveloperName"
      data_type: "varchar(255)"
      is_required: false
    
    - source_field: "Business_Developer_Email_Address"
      destination_field: "BusinessDeveloperEmailAddress"
      data_type: "varchar(255)"
      is_required: false
    
    - source_field: "Engagement_Project_Executive"
      destination_field: "EngagementProjectExecutive"
      data_type: "varchar(255)"
      is_required: false
    
    - source_field: "Engagement_Project_Executive_Name"
      destination_field: "EngagementProjectExecutiveName"
      data_type: "varchar(255)"
      is_required: false
    
    - source_field: "Implementation_Countries_List"
      destination_field: "ImplementationCountriesList"
      data_type: "text"
      is_required: false
    
    - source_field: "Outputs_List"
      destination_field: "OutputsList"
      data_type: "text"
      is_required: false
    
    - source_field: "SDG_List"
      destination_field: "SDGList"
      data_type: "text"
      is_required: false
    
    - source_field: "Engagement_Description"
      destination_field: "EngagementDescription"
      data_type: "text"
      is_required: false
    
    - source_field: "Engagement_Long_Description"
      destination_field: "EngagementLongDescription"
      data_type: "text"
      is_required: false

sync_options:
  sync_mode: Upsert
  batch_processing: true

validation:
  required_source_fields:
    - "Base_Engagement"
    - "Engagement_Description"
  
error_handling:
  on_connection_error: RetryWithBackoff
  on_mapping_error: SkipRecord

logging:
  log_level: "Debug"
  log_sql_queries: true
  log_record_details: true
