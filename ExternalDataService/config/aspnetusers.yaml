metadata:
  name: "ASPNetUsers Sync"
  description: "ASPNetUsers data sync"
  version: "1.0"
  enabled: true
  max_retry_attempts: 1
  timeout_minutes: 5

source:
  type: "bigquery"
  
  query: |
    SELECT DISTINCT
      PARSE_NUMERIC(Resource) as Id
      , true as IsInternal
      , Resource_Email_Address_Primary as UserName
      , UPPER(Resource_Email_Address_Primary) AS NormalizedUserName
      , Resource_Email_Address_Primary as Email
      , UPPER(Resource_Email_Address_Primary) AS NormalizedEmail
      , true as EmailConfirmed
      , NULL AS PasswordHash
      , NULL as SecurityStamp
      , NULL as ConcurrencyStamp
      , NULL as PhoneNumber
      , false as PhoneNumberConfirmed
      , false as TwoFactorEnabled
      , NULL as LockoutEnd
      , true as LockoutEnabled
      , 0 as AccessFailedCount
    FROM
      unopsreporting.Employment.People_Search_Report
    WHERE
      Effective_Date = CURRENT_DATE()
      AND Employment_Status = 'N'
      AND Employment_Type IN ('OPSSTAFF', 'OPSNONSTAFF')
      AND TRIM(Resource_Email_Address_Primary) > ''
      QUALIFY ROW_NUMBER() OVER (
          PARTITION BY PARSE_NUMERIC(Resource)
          ORDER BY Resource_Email_Address_Primary
        ) = 1
  
  primary_key_field: "Id"
  batch_size: 1000

destination:
  table_name: "AspNetUsers"
  schema: "public"
  manage_table_structure: false  # Only validate, don't create/alter
  add_standard_fields: false
  
  field_mappings:
    - source_field: "Id"
      destination_field: "Id"
      data_type: "integer"
      is_unique: true
      is_required: true

    - source_field: "IsInternal"
      destination_field: "IsInternal"
      data_type: "boolean"
      is_required: false

    - source_field: "UserName"
      destination_field: "UserName"
      data_type: "varchar(255)"
      is_required: true

    - source_field: "NormalizedUserName"
      destination_field: "NormalizedUserName"
      data_type: "varchar(255)"
      is_required: true
      
    - source_field: "Email"
      destination_field: "Email"
      data_type: "varchar(255)"
      is_required: true

    - source_field: "NormalizedEmail"
      destination_field: "NormalizedEmail"
      data_type: "varchar(255)"
      is_required: true

    - source_field: "EmailConfirmed"
      destination_field: "EmailConfirmed"
      data_type: "boolean"
      is_required: false

    - source_field: "PasswordHash"
      destination_field: "PasswordHash"
      data_type: "varchar(255)"
      is_required: false

    - source_field: "SecurityStamp"
      destination_field: "SecurityStamp"
      data_type: "varchar(255)"
      is_required: false

    - source_field: "ConcurrencyStamp"
      destination_field: "ConcurrencyStamp"
      data_type: "varchar(255)"
      is_required: false

    - source_field: "PhoneNumber"
      destination_field: "PhoneNumber"
      data_type: "varchar(255)"
      is_required: false

    - source_field: "PhoneNumberConfirmed"
      destination_field: "PhoneNumberConfirmed"
      data_type: "boolean"
      is_required: false

    - source_field: "TwoFactorEnabled"
      destination_field: "TwoFactorEnabled"
      data_type: "boolean"
      is_required: false

    - source_field: "LockoutEnd"
      destination_field: "LockoutEnd"
      data_type: "timestamp"
      is_required: false

    - source_field: "LockoutEnabled"
      destination_field: "LockoutEnabled"
      data_type: "boolean"
      is_required: false

    - source_field: "AccessFailedCount"
      destination_field: "AccessFailedCount"
      data_type: "integer"
      is_required: false


sync_options:
  sync_mode: Upsert
  batch_processing: true

validation:
  required_source_fields:
    - "Id"
    - "UserName"
  
error_handling:
  on_connection_error: RetryWithBackoff
  on_mapping_error: SkipRecord

logging:
  log_level: "Debug"
  log_sql_queries: true
  log_record_details: true
