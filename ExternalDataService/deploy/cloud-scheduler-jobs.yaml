# Cloud Scheduler Jobs for UNOPS Opportunity+ (PAO) - External Data Integration Service
# Deploy these after the External Data Service is running
# These jobs are specific to the PAO application and its data synchronization needs
#
# ============================================================================
# DEPLOYMENT CONFIGURATION
# ============================================================================
#
# URL Pattern (TO BE PROVIDED BY INFRA):
#   prod:        https://eds.opportunityplus.unops.org
#   qa:          https://eds.opportunityplus-qa.unops.org
#   dev/test:    https://eds.opportunityplus-{ENVIRONMENT}.unops.org
#
# Scheduler Region Mapping (Cloud Scheduler doesn't support all regions):
#   europe-west4 (Cloud Run) -> europe-west3 (Scheduler)
#
# ============================================================================
# ENVIRONMENT CONFIGURATION (from appsettings.{Env}.json)
# ============================================================================
#
# OAuth Client IDs: TO_BE_PROVIDED_BY_INFRA for each environment
#
# ============================================================================
# IMPORTANT: IAP (Identity-Aware Proxy) Configuration
# ============================================================================
#
# When using load balancer URLs with IAP:
#   - The oidcToken.audience MUST be the OAuth Client ID, NOT the service URL
#   - The OAuth Client ID is stored in CloudScheduler.OAuthClientId in appsettings
#   - The deployment scripts auto-read this value from the config files
#
# ============================================================================

# ============================================================================
# ORDER: Matches config/01-aspnetusers through config/12-exchange-rates
# ============================================================================

# 01 - Daily Users Sync - AspNetUsers from UNOPS Resource data
users-daily-sync:
  name: "pao-external-data-users-daily"
  description: "Daily synchronization of AspNetUsers from UNOPS Resource data"
  schedule: "0 2 * * *"  # 2:00 AM - 01
  timeZone: "Europe/Copenhagen"
  httpTarget:
    uri: "/api/sync/execute/users"
    httpMethod: "POST"
    headers:
      Content-Type: "application/json"
    oidcToken:
      serviceAccountEmail: "cloud-scheduler-invoker@${PROJECT_ID}.iam.gserviceaccount.com"
      audience: "${OAUTH_CLIENT_ID}"
  retryConfig:
    retryCount: 3
    maxBackoffDuration: "3600s"
    minBackoffDuration: "5s"
  attemptDeadline: "1800s"

