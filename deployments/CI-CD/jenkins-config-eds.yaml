environments:
  production:
    branch_pattern: "^production$"
    environment: "Production"
    project_id: "unops-opportunityplus-prod"
    repo_name: "cloud-run-images"
    image_name: "cloud-run-images/external-data-service-prod"
    service_name: "external-data-service-prod"
    region: "europe-west4"
    sql_conn_string: "unops-opportunityplus-prod:europe-west4:unops-opportunityplus-prod-postgres-001"
    vpc_connector: "projects/unops-opportunityplus-prod/locations/europe-west4/connectors/opportunityplus-prod-vpc"
    secrets: "ConnectionStrings__DefaultConnection=Prod_Monitoring_DB_Connection_String:latest,ConnectionStrings__ApplicationConnection=Prod_DB_Connection_String:latest"
    env_vars: "ASPNETCORE_ENVIRONMENT=Production,GOOGLE_CLOUD_PROJECT=unops-opportunityplus-prod,ExternalDataService__ConfigurationPath=./ExternalDataService/config"
    credentials_id: "cicd-sa-oplus-prod"
    service_account: "eds-service@unops-opportunityplus-prod.iam.gserviceaccount.com"
    invoker_service_accounts: "service-70092411004@gcp-sa-iap.iam.gserviceaccount.com,cloud-scheduler-invoker@unops-opportunityplus-prod.iam.gserviceaccount.com"
    dockerfile: "Dockerfile"
    port: "8080"
    min_instances: "0"
    max_instances: "3"
    memory: "2Gi"
    cpu: "1"
    timeout: "900"
    # Cloud Scheduler Configuration
    scheduler_enabled: true
    scheduler_setup_script: "./ExternalDataService/deploy/setup-cloud-scheduler.sh"

