environments:
  production:
    branch_pattern: "^production$"
    environment: "Production"
    project_id: "unops-opportunityplus-prod"
    repo_name: "cloud-run-images"
    image_name_main: "cloud-run-images/opportunityplus-prod"
    image_name_ai: "cloud-run-images/opportunityplus-ai-prod"
    service_name_main: "opportunityplus-prod"
    service_name_ai: "opportunityplus-ai-prod"
    region: "europe-west4"
    sql_conn_string: "unops-opportunityplus-prod:europe-west4:unops-opportunityplus-prod-postgres-001"
    vpc_connector: "projects/unops-opportunityplus-prod/locations/europe-west4/connectors/opportunityplus-prod-vpc"
    secrets_main: "Prod_DB_Connection_String=Prod_DB_Connection_String:latest,GoogleDriveServiceAccount_JSON=GoogleDriveServiceAccount_JSON:latest,AI_Setup_Secret=AI_Setup_Secret:latest"
    env_vars_ai: "CURRENT_ENV=prod,GOOGLE_CLOUD_PROJECT=unops-opportunityplus-prod,GOOGLE_CLOUD_LOCATION=europe-west4,GOOGLE_GENAI_USE_VERTEXAI=TRUE"
    credentials_id: "cicd-sa-oplus-prod"
    dockerfile_main: "Dockerfile.prod"
    port_main: "7123"
    port_ai: "8080"
    ai_min_instances: "1"
    ai_max_instances: "10"
    ai_memory: "2Gi"

  test:
    branch_pattern: "^test$"
