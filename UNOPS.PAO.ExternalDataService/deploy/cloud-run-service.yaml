apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: unops-pao-external-data-service
  labels:
    component: external-data-service
    environment: production
    managed-by: cloud-build
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/execution-environment: gen2
    run.googleapis.com/cpu-throttling: "false"
    run.googleapis.com/min-instances: "0"
spec:
  template:
    metadata:
      labels:
        component: external-data-service
        environment: production
      annotations:
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/cpu-throttling: "false"
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
    spec:
      containerConcurrency: 10
      timeoutSeconds: 3600
      serviceAccountName: external-data-service@PROJECT_ID.iam.gserviceaccount.com
      containers:
      - name: external-data-service
        image: gcr.io/PROJECT_ID/unops-pao-external-data-service:latest
        ports:
        - name: http1
          containerPort: 8080
        resources:
          limits:
            cpu: "2"
            memory: "4Gi"
          requests:
            cpu: "1"
            memory: "2Gi"
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: ExternalDataService__ConfigurationPath
          value: "/app/config"
        - name: BigQuery__UseDefaultCredentials
          value: "true"
        - name: ConnectionStrings__DefaultConnection
          valueFrom:
            secretKeyRef:
              name: database-connection-string
              key: connection-string
        - name: AdminApiKey
          valueFrom:
            secretKeyRef:
              name: admin-api-key
              key: api-key
        # Environment variables for monitoring and tracing
        - name: GOOGLE_CLOUD_PROJECT
          value: "PROJECT_ID"
        - name: K_SERVICE
          value: "unops-pao-external-data-service"
        - name: K_REVISION
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['serving.knative.dev/revision']
        
        # Startup and liveness probes
        startupProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3

        # Security context
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL

        # Volume mounts for configuration
        volumeMounts:
        - name: config-volume
          mountPath: /app/config
          readOnly: true
        - name: tmp-volume
          mountPath: /tmp
        - name: logs-volume
          mountPath: /app/logs

      volumes:
      - name: config-volume
        secret:
          secretName: sync-configurations
          optional: true
      - name: tmp-volume
        emptyDir: {}
      - name: logs-volume
        emptyDir: {}

  traffic:
  - percent: 100
    latestRevision: true
