# Cloud Build configuration for External Data Integration Service
steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '--tag', 'gcr.io/$PROJECT_ID/unops-pao-external-data-service:$COMMIT_SHA',
      '--tag', 'gcr.io/$PROJECT_ID/unops-pao-external-data-service:latest',
      '--build-arg', 'BUILD_CONFIGURATION=Release',
      '.'
    ]
    dir: 'UNOPS.PAO.ExternalDataService'

  # Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'push', 
      'gcr.io/$PROJECT_ID/unops-pao-external-data-service:$COMMIT_SHA'
    ]

  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'push', 
      'gcr.io/$PROJECT_ID/unops-pao-external-data-service:latest'
    ]

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args: [
      'run', 'deploy', 'unops-pao-external-data-service',
      '--image', 'gcr.io/$PROJECT_ID/unops-pao-external-data-service:$COMMIT_SHA',
      '--region', 'us-central1',
      '--platform', 'managed',
      '--allow-unauthenticated=false',
      '--cpu-throttling=false',
      '--min-instances', '0',
      '--max-instances', '10',
      '--memory', '4Gi',
      '--cpu', '2',
      '--timeout', '3600',
      '--concurrency', '10',
      '--set-env-vars', 'ASPNETCORE_ENVIRONMENT=Production',
      '--set-env-vars', 'ExternalDataService__ConfigurationPath=/app/config',
      '--set-env-vars', 'BigQuery__UseDefaultCredentials=true',
      '--update-labels', 'component=external-data-service,environment=production'
    ]

# Store images for 30 days
options:
  machineType: 'E2_HIGHCPU_8'
  
images:
  - 'gcr.io/$PROJECT_ID/unops-pao-external-data-service:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/unops-pao-external-data-service:latest'

# Build timeout
timeout: '1200s'

# Substitutions for environment-specific deployments
substitutions:
  _SERVICE_NAME: 'unops-pao-external-data-service'
  _REGION: 'us-central1'
  _MEMORY: '4Gi'
  _CPU: '2'
  _MAX_INSTANCES: '10'
