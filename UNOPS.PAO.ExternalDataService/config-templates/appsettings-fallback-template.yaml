# Example sync configuration that uses appsettings.json for BigQuery project ID
metadata:
  name: "Partners Sync - Appsettings Project"
  description: "Example showing BigQuery project fallback to appsettings"
  version: "1.0"
  enabled: false
  schedule_cron: "0 6 * * *"
  max_retry_attempts: 3
  timeout_minutes: 30

source:
  type: "bigquery"
  connection:
    # project_id: omitted - will use appsettings.json BigQuery.ProjectId
    use_environment_auth: true
  
  query: |
    SELECT 
      partner_id,
      name,
      email,
      updated_at
    FROM `your-dataset.partners`
    WHERE updated_at >= @last_sync_date
    ORDER BY updated_at ASC
  
  primary_key_field: "partner_id"
  incremental_field: "updated_at"
  batch_size: 100

destination:
  table_name: "ExternalPartners"
  schema: "integration"
  
  field_mappings:
    - source_field: "partner_id"
      destination_field: "ExternalId"
      data_type: "varchar(100)"
      is_required: true
      is_unique: true
    
    - source_field: "name"
      destination_field: "Name"
      data_type: "varchar(255)"
      is_required: true
      transformations:
        - type: "trim"
    
    - source_field: "email"
      destination_field: "Email"
      data_type: "varchar(255)"
      is_required: false
      transformations:
        - type: "lowercase"
        - type: "validate_email"
