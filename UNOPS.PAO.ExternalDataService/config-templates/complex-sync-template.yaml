metadata:
  name: "Advanced Project Sync Example"
  description: "Complex example with transformations, FK mappings, and validation"
  version: "1.0"
  enabled: false
  schedule_cron: "0 */4 * * *"  # Every 4 hours
  max_retry_attempts: 3
  timeout_minutes: 60

source:
  type: "bigquery"
  connection:
    project_id: "your-project-management-system"
    dataset_id: "projects"
    use_environment_auth: true
  
  query: |
    SELECT 
      p.project_id,
      p.project_name,
      p.status,
      p.start_date,
      p.end_date,
      p.budget_usd,
      p.partner_external_id,
      p.region_code,
      p.country_code,
      c.category_name,
      p.priority_level,
      p.contact_email,
      p.last_modified,
      p.created_by_name
    FROM `your-project.projects.active_projects` p
    LEFT JOIN `your-project.projects.categories` c ON p.category_id = c.id
    WHERE p.last_modified >= @last_sync_date
    ORDER BY p.last_modified ASC
  
  primary_key_field: "project_id"
  incremental_field: "last_modified"
  batch_size: 500

destination:
  table_name: "ExternalProjects"
  schema: "integration"
  
  field_mappings:
    - source_field: "project_id"
      destination_field: "ExternalProjectId"
      data_type: "varchar(50)"
      is_required: true
      is_unique: true
    
    - source_field: "project_name"
      destination_field: "ProjectName"
      data_type: "varchar(500)"
      is_required: true
      transformations:
        - type: "trim"
        - type: "title_case"
    
    - source_field: "status"
      destination_field: "Status"
      data_type: "varchar(50)"
      is_required: true
      transformations:
        - type: "uppercase"
        - type: "status_mapping"
          parameters:
            mapping:
              "ACTIVE": "Active"
              "COMPLETED": "Completed"
              "ON_HOLD": "On Hold"
              "CANCELLED": "Cancelled"
              "DRAFT": "Draft"
    
    - source_field: "budget_usd"
      destination_field: "BudgetUSD"
      data_type: "decimal(18,2)"
      is_required: false
      transformations:
        - type: "round"
          parameters:
            decimal_places: 2
        - type: "clamp"
          parameters:
            min: 0
            max: 999999999.99
    
    - source_field: "start_date"
      destination_field: "StartDate"
      data_type: "date"
      is_required: true
      transformations:
        - type: "format_date"
          parameters:
            format: "yyyy-MM-dd"
    
    - source_field: "end_date"
      destination_field: "EndDate"
      data_type: "date"
      is_required: false
    
    - source_field: "category_name"
      destination_field: "CategoryName"
      data_type: "varchar(200)"
      is_required: false
      transformations:
        - type: "default_if_empty"
          parameters:
            default_value: "Uncategorized"
    
    - source_field: "priority_level"
      destination_field: "PriorityLevel"
      data_type: "integer"
      is_required: false
      default_value: "3"  # Medium priority
    
    - source_field: "contact_email"
      destination_field: "ContactEmail"
      data_type: "varchar(255)"
      is_required: false
      transformations:
        - type: "lowercase"
        - type: "validate_email"
    
    - source_field: "created_by_name"
      destination_field: "CreatedByName"
      data_type: "varchar(255)"
      is_required: false
      transformations:
        - type: "trim"
        - type: "title_case"

  foreign_key_mappings:
    - source_field: "partner_external_id"
      lookup_table: "ExternalPartners"  # Reference to previously synced partners
      lookup_field: "ExternalId"
      destination_field: "PartnerId"
      lookup_return_field: "Id"
      is_required: false  # Some projects might not have partners
      on_lookup_fail: LogWarning
    
    - source_field: "region_code"
      lookup_table: "GeoRegions"
      lookup_field: "RegionCode"
      destination_field: "RegionId"
      lookup_return_field: "Id"
      is_required: false
      on_lookup_fail: SetNull
    
    - source_field: "country_code"
      lookup_table: "Countries"
      lookup_field: "CountryCode"
      destination_field: "CountryId"
      lookup_return_field: "Id"
      is_required: false
      on_lookup_fail: LogWarning

sync_options:
  sync_mode: Upsert
  delete_missing_records: false  # Don't delete projects that are no longer in source
  preserve_destination_fields:  # Fields to never overwrite
    - "Id"
    - "CreatedDate"
    - "CreatedBy"
    - "InternalNotes"  # Custom field added later
  conflict_resolution: SourceWins
  batch_processing: true
  parallel_processing: true
  max_parallel_batches: 3

validation:
  required_source_fields:
    - "project_id"
    - "project_name"
    - "status"
    - "start_date"
  
  data_quality_checks:
    - field: "budget_usd"
      rule: "min_value:0"
      action: LogWarning
    
    - field: "start_date"
      rule: "not_future_date"
      action: LogWarning
    
    - field: "contact_email"
      rule: "valid_email_format"
      action: LogWarning
    
    - field: "project_name"
      rule: "min_length:3"
      action: FailRecord
  
  duplicate_handling:
    check_field: "project_id"
    action: UpdateLatest

error_handling:
  on_connection_error: RetryWithBackoff
  on_query_error: FailBatch
  on_mapping_error: SkipRecord
  on_fk_lookup_error: LogAndContinue
  
  notification:
    on_failure: true
    on_success: false
    on_warning: true
    email_recipients:
      - "integration-team@unops.org"
      - "project-managers@unops.org"
    # slack_webhook: "https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK"

logging:
  log_level: "Information"
  log_sql_queries: true
  log_record_details: false
  retention_days: 90
